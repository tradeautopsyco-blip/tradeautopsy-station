name: TradeAutopsy Station
options:
  bundleIdPrefix: in.tradeautopsy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  Notch:
    path: ../notch
  Station:
    path: .
targets:
  TradeAutopsy Station:
    type: application
    platform: macOS
    sources:
      - path: StationApp/StationApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tradeautopsy.station
        PRODUCT_NAME: TradeAutopsy Station
        INFOPLIST_FILE: StationApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Notch
        product: Notch
      - package: Station
        product: Station
    postBuildScripts:
      - name: Copy Agent Binary
        basedOnDependencyAnalysis: false
        script: |
          set -e
          AGENT="${SRCROOT}/../agent/target/release/tradeautopsy-agent"
          if [ ! -f "$AGENT" ]; then
            echo "error: Agent binary not found at $AGENT — run 'cargo build --release' in agent/"
            exit 1
          fi
          cp "$AGENT" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/tradeautopsy-agent"
          chmod +x "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/tradeautopsy-agent"
