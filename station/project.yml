name: TradeAutopsy Station
options:
  bundleIdPrefix: in.tradeautopsy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  Notch:
    path: ../notch
  Station:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"
targets:
  TradeAutopsy Station:
    type: application
    platform: macOS
    sources:
      - path: StationApp/StationApp.swift
      - path: StationApp/AppIcon.icns
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tradeautopsy.station
        PRODUCT_NAME: TradeAutopsy Station
        INFOPLIST_FILE: StationApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_ENTITLEMENTS: StationApp/TradeAutopsy Station.entitlements
    dependencies:
      - package: Notch
        product: Notch
      - package: Sparkle
        product: Sparkle
      - package: Station
        product: Station
    postBuildScripts:
      - name: Compile App Icon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          exec "${SRCROOT}/Scripts/compile-app-icon.sh"
      - name: Copy Agent Binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          exec "${SRCROOT}/Scripts/build-and-copy-agent.sh" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS"
