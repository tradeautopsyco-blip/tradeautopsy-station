<head>

  <style>
    :root {
      --label: #f5f5f7;
      --secondary: rgba(245,245,247,.58);
      --tertiary: rgba(245,245,247,.32);
      --quaternary: rgba(245,245,247,.16);
      --bg: #000;
      --grouped: #1c1c1e;
      --grouped-2: #2c2c2e;
      --fill: rgba(120,120,128,.24);
      --fill-press: rgba(120,120,128,.36);
      --sep: rgba(84,84,88,.65);
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --teal: #64d2ff;
      --glass: rgba(28,28,30,.62);
      --sidebar: rgba(22,22,24,.78);
      --scrim: rgba(0,0,0,.42);
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font: 400 13px/1.4 var(--sans);
      letter-spacing: -.006em;
      font-optical-sizing: auto;
      background: #1a1a1c;
      color: var(--label);
      -webkit-font-smoothing: antialiased;
      padding: 22px 16px 100px;

    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

    .q {
      width: min(1180px, 100%); margin: 0 auto 12px;
      font-size: 11px; letter-spacing: .012em; color: var(--tertiary);
    }
    .q b { color: var(--secondary); font-weight: 600; letter-spacing: -.006em; font-size: 13px; }

    /* Window — Liquid Glass chrome, thicker sidebar */
    .mac {
      width: min(1180px, 100%); height: 780px; margin: 0 auto;
      background: var(--bg); border-radius: 12px; overflow: hidden; position: relative;
      box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    .titlebar {
      height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 0 14px;
      background: var(--glass);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-bottom: .5px solid rgba(255,255,255,.08);

    .traffic { display: flex; gap: 7px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }

    .traffic i:nth-child(2) { background: #febc2e; }

      color: var(--secondary); font-size: 13px; letter-spacing: -.006em;
    }
    .nav:hover { background: var(--fill); color: var(--label); }
    .nav.on { background: rgba(10,132,255,.28); color: var(--label); font-weight: 600; }
    .nav .ico { width: 17px; height: 17px; opacity: .72; flex-shrink: 0; color: var(--secondary); }
    .nav:hover .ico { opacity: .92; color: var(--label); }
    .nav.on .ico { color: var(--blue); opacity: 1; }
    .nav .badge {
      margin-left: auto; font-size: 11px; font-weight: 600;
      color: var(--orange); letter-spacing: .006em;
    }
    .sb-foot {
      margin-top: auto; padding: 10px 8px 4px;
      font-family: var(--mono); font-size: 10px; letter-spacing: .012em; color: var(--tertiary);
    }
    .sb-foot div { display: flex; justify-content: space-between; margin-top: 5px; }
    .ok { color: var(--green); }

    .stage { min-width: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .toolbar {
      flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
      padding: 10px 22px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
    }
    .large-title {
      font-size: 28px; font-weight: 700; letter-spacing: -.026em; line-height: 1.05;
    }
    .sub { font-size: 13px; color: var(--secondary); letter-spacing: -.006em; margin-top: 2px; }
    .cta {
      flex-shrink: 0; padding: 6px 14px; border-radius: 8px;
      background: var(--blue); color: #fff; font-size: 13px; font-weight: 600;
      letter-spacing: -.006em;
    }
    .cta.quiet { background: var(--fill); color: var(--label); }
    .scroll { flex: 1; overflow: auto; padding: 4px 22px 28px; }
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-thumb { background: #2c2c2e; border-radius: 4px; }

    .gain { color: var(--green); } .loss { color: var(--red); } .caut { color: var(--orange); }
    .muted { color: var(--tertiary); } .secy { color: var(--secondary); }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    .group { margin-bottom: 22px; }
    .group > h2 {

    .row + .row::before {
      content: ""; position: absolute; left: 16px; right: 0; top: 0; height: .5px;
      background: var(--sep);
    }
    .row:active { background: var(--fill-press); }
    .row .lab { flex: 1; min-width: 0; }
    .row .lab b { display: block; font-weight: 400; font-size: 17px; letter-spacing: -.022em; }
    .row .lab span { display: block; font-size: 12px; color: var(--secondary); letter-spacing: 0; margin-top: 1px; }
    .row .val { color: var(--tertiary); font-size: 17px; letter-spacing: -.022em; }

    .sw {

      transition: transform 180ms ease-out;

      .sw, .sw::after, .press { transition: none; }

    .tile .h { font-size: 12px; color: var(--secondary); margin-top: 4px; }
    .clock-tag {

    .ta-tick { fill: var(--tertiary); font-size: 10px; font-family: var(--sans); }
    .readout { font-family: var(--mono); font-size: 11px; color: var(--secondary); margin-top: 6px; }
    .sec-label {

    .hero4 { display: grid; grid-template-columns: repeat(3, 1fr) minmax(160px, 1fr); gap: 8px; margin-bottom: 12px; }
    .split-day { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; min-height: 0; }
    table.blot { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.blot th {
      text-align: left; font-size: 11px; color: var(--tertiary); font-weight: 400;
      padding: 6px 12px; border-bottom: .5px solid var(--sep);

    table.blot td { padding: 10px 12px; border-bottom: .5px solid var(--sep); vertical-align: top; }
    table.blot tr { cursor: pointer; }
    table.blot tr.sel td { background: rgba(10,132,255,.12); }
    .sym { font-weight: 600; letter-spacing: -.011em; }
    .hint { font-size: 12px; color: var(--secondary); margin-top: 2px; }
    .pill {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
      padding: 2px 8px; border-radius: 999px;

    .pill.warn { background: rgba(255,159,10,.16); color: var(--orange); }
    .pill.bad { background: rgba(255,69,58,.16); color: var(--red); }
    .pill.ok { background: rgba(48,209,88,.16); color: var(--green); }
    .pill.due { background: rgba(255,159,10,.16); color: var(--orange); }
    .flag { font-size: 11px; font-weight: 600; color: var(--red); }
    .t-row {
      display: grid; grid-template-columns: 52px 1.2fr 40px 48px 78px 1fr;
      align-items: center; min-height: 36px; font-size: 12px;
      padding: 0 12px; border-bottom: .5px solid var(--sep);
    }
    .t-row.head { color: var(--tertiary); font-size: 11px; min-height: 28px; }
    .row-act { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .btn {
      padding: 6px 12px; border-radius: 8px; background: var(--fill);
      font-size: 13px; font-weight: 500;
    }
    .btn.pri { background: var(--blue); color: #fff; font-weight: 600; }

    /* Journal */
    .j-split { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: start; }
    .day-btn { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; color: var(--secondary); }

      display: block; width: 72px; height: 48px; border-radius: 6px;

      display: flex; align-items: center; justify-content: center; font-weight: 500;

    /* Backend modules */
    .mod-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .badge.live { color: var(--green); }
    .badge.off { color: var(--tertiary); }
    .meta-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .meta-row .k { color: var(--secondary); }

    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: 360px;
      background: var(--sidebar); backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-left: .5px solid rgba(255,255,255,.08); padding: 18px 16px; overflow: auto; z-index: 6;
    }
    .card-detect {
      position: absolute; left: 50%; top: 72px; transform: translateX(-50%);
      width: 400px; background: var(--grouped); border-radius: 14px; padding: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5); z-index: 8;
      outline: .5px solid rgba(100,210,255,.28);
    }
    .card-detect h2 { font-size: 20px; font-weight: 700; letter-spacing: -.026em; margin: 8px 0 4px; }
    .delta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .delta .box { background: #000; border-radius: 10px; padding: 10px 12px; }
    .delta .box.better { outline: .5px solid rgba(48,209,88,.4); }
    .eq { height: 110px; margin-top: 8px; }
    .toast {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 12; padding: 8px 14px; border-radius: 999px;
      background: var(--grouped-2); font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: opacity 180ms ease-out;
    }

    .state {
      width: min(1180px, 100%); margin: 10px auto 0;
      background: #000; color: #8bffce; font-family: var(--mono); font-size: 10px;
      border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; max-height: 100px; overflow: auto;
    }
    .switcher {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; z-index: 50;
      background: #f4f4f5; color: #111; padding: 8px 10px; border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4); font-size: 12px; font-weight: 600;

    .switcher button { width: 32px; height: 32px; border-radius: 50%; background: #111; color: #fff; font-size: 14px; }
    .switcher .lab { min-width: 250px; text-align: center; }
    .switcher .lab span { display: block; font-size: 10px; color: #666; font-weight: 500; }

    @media (prefers-reduced-transparency: reduce) {
      .titlebar, .sidebar, .drawer { background: #1c1c1e; backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      .inset, .tile { outline: 1px solid #fff; }
    }
  </style>
</head>

function money(n) {
  const s = n < 0 ? "−" : n > 0 ? "+" : "";
  return s + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
}
function pct(n) { return (n * 100).toFixed(2) + "%"; }
function accPct(rupees) { return pct(rupees / DAY.account); }
function calmWord(n) { return ["", "Calm", "Focused", "Tense", "Anxious", "Angry"][n] || ""; }
function kindLabel(k) {
  return ({ intraday: "Intraday", swing: "Swing", positional: "Positional", scalper_session: "Scalper", pre_market: "Pre-market" })[k] || k;
}
function statusPill(st) {
  const map = { matched: ["ok", "Matched"], pending: ["warn", "Pending"], expired: ["due", "Expired"], cancelled: ["due", "Cancelled"], impulsive: ["bad", "Impulsive"] };
  const [cls, lab] = map[st] || ["due", st];
  return `<span class="pill ${cls}">${lab}</span>`;
}
function journalPack() {
  const pack = JOURNAL[S.journalDay] || { sheet: "", emotion: "", decls: [], trips: [] };
  return { ...pack, trips: S.journalDay === "20" ? DAY.closed : (pack.trips || []) };
}
function declById(id) { return (journalPack().decls || []).find(d => d.id === id); }
function qHit(parts, q) {
  if (!q) return true;
  return parts.filter(Boolean).join(" ").toLowerCase().includes(q.toLowerCase());
}
function plannedLoss(p) { return p.plannedSl == null ? null : p.qty * Math.abs(p.entry - p.plannedSl); }
function actualLoss(p) { return p.sl == null ? null : p.qty * Math.abs(p.entry - p.sl); }

function drawFloor(host, mini) {
  if (!host) return;
  const series = DAY.pnl, floorY = -DAY.floor;
  const w = host.clientWidth || (mini ? 480 : 700), h = mini ? 88 : 156, l = 8, r = 48, t = 10, b = 22;
  const yMin = floorY - 800, yMax = 5000;
  const xAt = (i) => l + (i / (series.length - 1)) * (w - l - r);
  const yAt = (v) => t + (1 - (v - yMin) / (yMax - yMin)) * (h - t - b);
  const pts = series.map((v, i) => [xAt(i), yAt(v)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  const fy = yAt(floorY), zy = yAt(0);
  const area = line + " L" + last[0].toFixed(1) + " " + zy.toFixed(1) + " L" + pts[0][0].toFixed(1) + " " + zy.toFixed(1) + " Z";
  const ticks = mini ? "" : DAY.times.map((lab, i) => `<text class="ta-tick" x="${xAt(i)}" y="${h-6}" text-anchor="middle">${lab}</text>`).join("");
  host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="This day's closed P and L versus daily floor">
    <line x1="${l}" x2="${w-r}" y1="${zy}" y2="${zy}" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 3"/>
    <line x1="${l}" x2="${w-r}" y1="${fy}" y2="${fy}" stroke="rgba(255,69,58,.55)" stroke-dasharray="4 4"/>
    <path d="${area}" fill="rgba(255,69,58,.12)"/>
    <path d="${line}" fill="none" stroke="#FF453A" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="${last[0]+4}" y="${last[1]-9}" width="50" height="16" rx="8" fill="#FF453A"/>
    <text x="${last[0]+29}" y="${last[1]+3}" text-anchor="middle" fill="#fff" font-size="9" font-family="ui-monospace,monospace">−₹5.8k</text>
    ${ticks}
  </svg>`;
}

    </div>
    <div class="snap-grid">

function journalDrawer() {
  const pick = S.journalPick;
  if (!pick) return "";
  const pack = journalPack();
  if (pick.kind === "sheet") {
    return `<aside class="drawer wide">
      <div class="clock-tag">Day sheet · notebook pin</div>
      <h2 class="large-title" style="font-size:22px">${DAY.journalDays.find(d => d.id===S.journalDay)?.d || "Day"}</h2>
      <p class="hint" style="margin:10px 0">${pack.sheet}</p>
      <p class="hint">Feeling ${pack.emotion}. Shadow journal and weekly review live in Console — Station keeps the local week.</p>
      <div class="row-act">
        <button class="btn pri press" data-act="open-console-j">Open in Console</button>
        <button class="btn press" data-act="close-jcard">Close</button>
      </div>
    </aside>`;
  }
  if (pick.kind === "open") {
    const p = DAY.open.find(x => x.id === pick.id);
    if (!p) return "";
    return `<aside class="drawer wide">
      <div class="clock-tag">Undeclared open</div>
      <h2 class="large-title" style="font-size:22px">${p.symbol}</h2>
      <p class="hint">${p.sentence}</p>
      <div class="chips" style="margin:10px 0">${statusPill("impulsive")}<span class="pill due">No declarationId</span></div>
      <p class="hint">Fill with no frozen plan. Console cannot score fidelity. Plan in Notch — do not invent a stop here.</p>
      <p class="hint ${p.mtmToday>=0?"gain":"loss"}" style="margin-top:8px">Today MTM ${money(p.mtmToday)} · ${accPct(Math.abs(p.mtmToday))} of account</p>

        <button class="btn pri press" data-act="open-notch">Plan in Notch</button>
        <button class="btn press" data-act="close-jcard">Close</button>
      </div>
    </aside>`;
  }
  const d = declById(pick.id);
  if (!d) return "";
  const trip = d.trip != null ? pack.trips[d.trip] : null;
  return `<aside class="drawer wide">
    ${declSnapshot(d)}
    ${trip ? `<p class="hint" style="margin-top:10px">Matched fill ${trip.t} · ${trip.hold} · <span class="${trip.net>=0?"gain":"loss"}">${money(trip.net)}</span>${trip.flag ? " · " + trip.flag : ""}</p>` : ""}
    <div class="row-act">
      <button class="btn pri press" data-act="open-console-j">Open in Console</button>
      <button class="btn press" data-act="close-jcard">Close</button>
    </div>
  </aside>`;
}

function journalScreen() {
  const pack = journalPack();
  const q = S.journalQuery.trim();
  const facet = S.journalFacet;
  const decls = pack.decls.filter(d => {
    if (!qHit([d.symbol, d.right, d.setup, d.kind, d.pre, d.live, d.post, d.emotion, d.signal, d.inv, d.status], q)) return false;
    if (facet === "matched") return d.status === "matched";
    if (facet === "unmatched") return d.status === "expired" || d.status === "cancelled";
    if (facet === "pending") return d.status === "pending";
    if (facet === "postdue") return d.status === "matched" && pack.trips[d.trip] && !pack.trips[d.trip].post;
    if (facet === "impulsive") return false;
    return true;
  });
  const undeclared = (S.journalDay === "20" && (facet === "all" || facet === "impulsive") && qHit(["BANKNIFTY", "impulsive", "MIS"], q))
    ? DAY.open.filter(p => p.id === "bn") : [];
  const postDue = pack.decls.filter(d => d.status === "matched" && pack.trips[d.trip] && !pack.trips[d.trip].post).length;
  const unmatched = pack.decls.filter(d => d.status === "expired" || d.status === "cancelled").length;
  const pending = pack.decls.filter(d => d.status === "pending").length;
  const facets = [
    ["all", "All"],
    ["matched", "Matched"],
    ["pending", "Pending"],
    ["unmatched", "Unmatched"],
    ["postdue", "Post due"],
    ["impulsive", "Impulsive"],
  ];
  return `${toolbar("Journal", "Every declaration that hit Console · local week, then the hosted sheet", "Make another", "open-notch")}
    <div class="scroll">
      <p class="sub" style="margin-bottom:12px">Capture is still Notch. This page is the frozen plan — matched, pending, expired, cancelled — plus pre / live / post. ${postDue ? `<b style="color:var(--orange);font-weight:600">${postDue} post due.</b>` : "Posts saved."} ${unmatched ? `${unmatched} never filled.` : ""} ${pending ? `${pending} still pending.` : ""}</p>

        <input class="j-search" data-act="jsearch" type="search" placeholder="Search symbol, setup, emotion…" value="${S.journalQuery.replace(/"/g, "&quot;")}" />
        <div class="seg">${facets.map(([id, lab]) => `<button type="button" class="${facet===id?"on":""}" data-act="jfacet" data-id="${id}">${lab}</button>`).join("")}</div>
        <button type="button" class="btn press" data-act="toast" data-id="Export is Console markdown for this day sheet.">Export</button>
      </div>
      <div class="j-split">
        <div class="group" style="margin:0">
          <h2>This week</h2>
          <div class="inset">
            ${DAY.journalDays.map(d => `
              <button type="button" class="row day-btn ${S.journalDay===d.id?"on":""}" data-act="jday" data-id="${d.id}">
                <div class="lab"><b style="font-size:15px">${d.d}</b><span>${d.n}</span></div>
              </button>`).join("")}
          </div>
          <p class="foot">Older days live in Console. Query by emotion and setup is the same search.</p>
        </div>
        <div>
          <div class="group" style="margin:0 0 18px">
            <h2>Day sheet</h2>
            <div class="inset">
              <button type="button" class="row j-card" data-act="jsheet">
                <div class="lab">
                  <div class="when">Notebook pin · feeling ${pack.emotion}</div>
                  <div class="name" style="font-size:15px;font-weight:500">${pack.sheet}</div>
                </div>
                <span class="chev" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="group" style="margin:0 0 18px">
            <h2>Declarations that went to Console</h2>
            <div class="inset">
              ${decls.length ? decls.map(d => `
                <button type="button" class="row j-card" data-act="jdecl" data-id="${d.id}">
                  <div class="lab">
                    <div class="when">${d.t} · ${kindLabel(d.kind)} · calm ${d.calm} ${calmWord(d.calm)} · conf ${d.conf}</div>
                    <div class="name">${[d.symbol, d.right].filter(Boolean).join(" ")}
                      <span style="font-weight:500;color:var(--secondary);font-size:13px"> ${d.side} ${d.qty}</span>
                    </div>
                    <div class="snap">${d.setup} · SL ${d.sl} · invalidation ${d.invKind}${d.fid != null ? ` · fidelity ${d.fid}` : ""}</div>
                    <div class="chips">${statusPill(d.status)}
                      ${d.signal ? `<span class="pill ${d.signal==="Clean"||d.signal==="Insight"?"ok":"bad"}">${d.signal}</span>` : ""}
                      ${d.shots ? `<span class="pill ok">${d.shots} shot${d.shots>1?"s":""}</span>` : ""}
                      ${d.voice ? `<span class="pill ok">Voice</span>` : ""}
                      ${d.status==="matched" ? chips(pack.trips[d.trip] || {pre:1,live:1,post:1}) : ""}
                    </div>
                  </div>
                  <span class="chev" aria-hidden="true"></span>
                </button>`).join("") : `<div class="row"><div class="lab"><b>Nothing in this filter</b><span>Declarations still live on Console. This is the local week.</span></div></div>`}

            <p class="foot">A changed plan is a new declaration. Cancelled-before-fill and expired unmatched stay on the sheet — they already went to Console.</p>
          </div>
          ${undeclared.length ? `<div class="group" style="margin:0">
            <h2>Impulsive · no declaration</h2>
            <div class="inset">
              ${undeclared.map(p => `
                <button type="button" class="row j-card" data-act="jopen" data-id="${p.id}">

                    <div class="when">Still open · no declarationId</div>
                    <div class="name">${p.symbol}</div>
                    <div class="snap">${p.sentence}</div>
                    <div class="chips">${statusPill("impulsive")}</div>

                  <span class="chev" aria-hidden="true"></span>
                </button>`).join("")}
            </div>
            <p class="foot">No frozen plan → no fidelity. Plan in Notch.</p>
          </div>` : ""}
        </div>
      </div>
    </div>`;
}

          </button>
        </div>
        <p class="foot">No AI overview. These switches only change what gets attached to a journal card.</p>
      </div>
    </div>`;
}

function settingsScreen() {
  return `${toolbar("Settings", "This Mac · limits sync to the Notch · they do not fire Kill")}
    <div class="scroll">
      <div class="group">
        <h2>General</h2>
        <div class="inset">
          <button type="button" class="row" data-act="toggle" data-id="launch">
            <div class="lab"><b>Launch at login</b><span>Start Station when this Mac wakes to the desk</span></div>
            <span class="sw ${S.launchAtLogin?"on":""}" role="switch" aria-checked="${S.launchAtLogin}"></span>
          </button>
          <button type="button" class="row press" data-act="toast" data-id="Appearance follows the system. Dark is this prototype.">
            <div class="lab"><b>Appearance</b></div>
            <span class="val">System</span><span class="chev"></span>
          </button>
        </div>
      </div>
      <div class="group">
        <h2>Risk limits</h2>
        <div class="inset">
          <button type="button" class="row press" data-act="toast" data-id="Daily floor is the rule you set. Remaining is a T8 preview.">
            <div class="lab"><b>Daily floor</b><span>Used today ${money(-DAY.used)}</span></div>
            <span class="val">${money(DAY.floor).replace("+","")}</span><span class="chev"></span>
          </button>
          <button type="button" class="row press" data-act="toast" data-id="Mean loss is a Settings number, not live T8 math.">
            <div class="lab"><b>Mean loss</b></div>
            <span class="val">${money(DAY.meanLoss).replace("+","")}</span><span class="chev"></span>
          </button>
          <button type="button" class="row press" data-act="toast" data-id="Max trips is the rule. Station does not invent more.">
            <div class="lab"><b>Max round trips</b></div>
            <span class="val">12</span><span class="chev"></span>
          </button>
        </div>
        <p class="foot">These numbers sync to the Notch. They do not fire Kill. Stop pauses sync. Kill is the Notch overlay.</p>
      </div>
      <div class="group">
        <h2>Notch</h2>
        <div class="inset">
          <button type="button" class="row" data-act="toggle" data-id="hideNotch">
            <div class="lab"><b>Hide Notch</b><span>⌥Space still summons it when you need the hands</span></div>
            <span class="sw ${S.hideNotch?"on":""}" role="switch" aria-checked="${S.hideNotch}"></span>
          </button>
          <button type="button" class="row press" data-act="open-notch">
            <div class="lab"><b>Open Notch</b><span>Live circuit · declare · kill path</span></div>
            <span class="chev"></span>
          </button>
        </div>
      </div>
      <div class="group">
        <h2>Privacy</h2>
        <div class="inset">
          <button type="button" class="row press" data-act="toast" data-id="Keys stay on the broker card in Backend Box.">
            <div class="lab"><b>API keys</b><span>Sit next to the broker they affect</span></div>
            <span class="val">Backend Box</span><span class="chev"></span>
          </button>
        </div>
        <p class="foot">Patterns, escrow, and fidelity stay Console — they are not Settings, and they are not Backend Box.</p>
      </div>
    </div>`;
}

function paintCharts() {
  document.querySelectorAll("[data-chart]").forEach((el) => {
    drawFloor(el, el.getAttribute("data-chart") === "mini");
  });
}

function paint() {
  document.getElementById("mac").innerHTML = chrome();
  requestAnimationFrame(paintCharts);
  document.getElementById("state").textContent = "STATE " + JSON.stringify({
    variant: S.variant, route: S.route, selected: S.selected,
    journalDay: S.journalDay, journalPick: S.journalPick, journalFacet: S.journalFacet,
    journalQuery: S.journalQuery,
    detection: S.detection, consoleOpen: S.consoleOpen,
    launchAtLogin: S.launchAtLogin, hideNotch: S.hideNotch,
    capture: S.capture, debrief: S.debrief, quote: DAY.quote,
    remainingRisk: "NOT ON TODAY — T8 preview", blendClosedIntoOpen: false,
  }, null, 2);
  const i = VARIANTS.findIndex(v => v.key === S.variant);
  const v = VARIANTS[i];
  const jnote = S.route === "journal" ? "Journal is declarations + day sheet — same in A/B/C" : "sidebar is Journal / Backend / Settings";
  document.getElementById("switcher").innerHTML = `
    <button type="button" data-act="prev" aria-label="Previous Today layout">←</button>
    <div class="lab">${v.key} — ${v.name}<span>${v.blurb} · ${jnote}</span></div>
    <button type="button" data-act="next" aria-label="Next Today layout">→</button>`;
}

function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set("variant", S.variant);
  u.searchParams.set("route", S.route);
  history.replaceState(null, "", u);
}
function setVariant(key) {
  S.variant = key;
  syncUrl();
  paint();
}
function cycle(d) {
  const i = VARIANTS.findIndex(v => v.key === S.variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  const id = t.getAttribute("data-id");
  if (act === "prev") cycle(-1);
  if (act === "next") cycle(1);
  if (act === "jsearch") return;
  if (act === "route") { S.route = id; S.consoleOpen = false; S.detection = null; S.journalCard = null; S.journalPick = null; syncUrl(); }
  if (act === "select") S.selected = id;
  if (act === "deeper") { S.selected = id; S.consoleOpen = true; }
  if (act === "open-console") S.consoleOpen = true;
  if (act === "close-console") S.consoleOpen = false;
  if (act === "detect-plan") S.detection = "plan";
  if (act === "detect-noform") S.detection = "noform";
  if (act === "dismiss-detect") S.detection = null;
  if (act === "open-notch") { S.detection = null; say(S.route === "journal" ? "Opens Notch · Pre-trade. Next declaration." : "Opens Notch. Today stays the mirror."); return; }
  if (act === "jday") { S.journalDay = id; S.journalPick = null; }
  if (act === "jfacet") { S.journalFacet = id; S.journalPick = null; }
  if (act === "jdecl") S.journalPick = { kind: "decl", id };
  if (act === "jsheet") S.journalPick = { kind: "sheet" };
  if (act === "jopen") S.journalPick = { kind: "open", id };
  if (act === "jcard") S.journalCard = Number(id);
  if (act === "close-jcard") { S.journalCard = null; S.journalPick = null; }
  if (act === "open-console-j") { S.journalPick = null; S.journalCard = null; say("Opens Console journal — this declaration and the day sheet."); return; }
  if (act === "add-broker") { say("Add broker. The box is supposed to get heavier."); return; }
  if (act === "toast") { say(id); return; }
  if (act === "toggle") {
    if (id === "launch") S.launchAtLogin = !S.launchAtLogin;
    if (id === "hideNotch") S.hideNotch = !S.hideNotch;
    if (id === "capture") S.capture = !S.capture;
    if (id === "debrief") S.debrief = !S.debrief;
  }
  paint();
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el || el.getAttribute("data-act") !== "jsearch") return;
  S.journalQuery = el.value;
  const start = el.selectionStart, end = el.selectionEnd;
  paint();
  const inp = document.querySelector("[data-act=jsearch]");
  if (inp) { inp.focus(); try { inp.setSelectionRange(start, end); } catch (err) {} }
});

document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".press");
  if (el) el.classList.add("is-down");
}, true);
document.addEventListener("pointerup", () => {
  document.querySelectorAll(".press.is-down").forEach((el) => el.classList.remove("is-down"));
}, true);

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

window.addEventListener("resize", paintCharts);

const params = new URLSearchParams(location.search);
const bootV = params.get("variant") || "A";
const bootR = (params.get("route") || "today").toLowerCase();
S.variant = VARIANTS.some(v => v.key === bootV) ? bootV : "A";
S.route = ROUTES.includes(bootR) ? bootR : "today";
paint();
</script>
</body>
</html>
