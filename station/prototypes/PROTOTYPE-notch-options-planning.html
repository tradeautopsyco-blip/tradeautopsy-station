  <style>

    .work { flex: 1; min-height: 0; display: flex; padding: 0 12px 12px; gap: 10px; }

    canvas { display: block; width: 100%; height: 100%; }

    .side {
      width: min(320px, 34vw); flex-shrink: 0; overflow: auto; background: rgba(14,14,16,.78); backdrop-filter: blur(32px);

    .srow { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; font-family: var(--mono); }

    .cta.ghost { background: rgba(255,255,255,.1); color: var(--label); }

    .note { font-size: 11px; color: var(--ter); margin-top: 6px; font-family: var(--mono); }
    .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }

    }

    .feel b { display: block; font-size: 13px; }

    .field input, .field textarea {
      width: 100%; padding: 7px 9px; border-radius: 10px; background: #111113; color: var(--label);

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .chipbtn { padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--sec); font-size: 12px; font-weight: 590; }
    .chipbtn.on { background: rgba(255,255,255,.14); color: var(--label); }
    .leg { display: flex; justify-content: space-between; align-items: center; padding: 7px 9px; border-radius: 10px; background: #111113; margin-bottom: 5px; font-size: 12px; }

    .rung { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: .5px solid rgba(255,255,255,.06); font-size: 12px; }

    .toast {
      position: absolute; left: 50%; top: 44px; transform: translateX(-50%); z-index: 20;
      padding: 8px 14px; border-radius: 999px; background: rgba(44,44,46,.92); font-size: 13px; opacity: 0; pointer-events: none;
    }

      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
      display: flex; align-items: center; gap: 10px; background: #f4f4f5; color: #111;
      padding: 8px 10px; border-radius: 999px; box-shadow: 0 8px 32px rgba(0,0,0,.45); font-size: 12px; font-weight: 600;
    }
    .switcher button { width: 32px; height: 32px; border-radius: 50%; background: #111; color: #fff; }
    .switcher .lab { min-width: 320px; text-align: center; }
    .switcher .lab span { display: block; font-size: 10px; color: #666; font-weight: 500; }

<body>
  <div class="q"><b>PROTOTYPE</b> · all live Options surfaces on one board · not live Notch · no PCR / max pain</div>
  <div class="osbar">
    <div class="l"><span></span><span>TradeAutopsy</span><span>View</span></div>
    <div class="island"><span class="mark">T</span><b>$0.00</b></div>
    <div class="r"><span>02:11</span></div>
  </div>
  <div class="desk"><div class="sheet" id="app"></div></div>
  <div class="switcher" id="switcher"></div>

<script>
const VARIANTS = [
  { key: "A", name: "Cockpit mosaic", blurb: "Session · OI · Payoff · Depth at once + Plan rail" },
  { key: "B", name: "Hero + twins", blurb: "Session owns · OI and Payoff follow · chain strip" },
  { key: "C", name: "Focus + floor", blurb: "One large chart · live thumbs · Plan as a floor" },
];
const OI_ROWS = [
  { id: "BTC-260925-85000-C", strike: "85000", right: "C", last: 1840.2, oi: 820.4, usd: "138800", delta: "0.82", gamma: "0.000018", theta: "−42.1", vega: "28.4" },
  { id: "BTC-260925-85000-P", strike: "85000", right: "P", last: 112.4, oi: 2100.0, usd: "355200", delta: "−0.18", gamma: "0.000018", theta: "−11.2", vega: "28.4" },
  { id: "BTC-260925-90000-C", strike: "90000", right: "C", last: 412.80, oi: 12448.21, usd: "2104412.80", delta: "0.41", gamma: "0.000031", theta: "−18.4", vega: "42.1" },
  { id: "BTC-260925-90000-P", strike: "90000", right: "P", last: 388.20, oi: 9102.40, usd: "1540088.00", delta: "−0.59", gamma: "0.000031", theta: "−19.1", vega: "42.1" },
  { id: "BTC-260925-95000-C", strike: "95000", right: "C", last: 188.40, oi: 4220.00, usd: "714180.00", delta: "0.22", gamma: "0.000024", theta: "−14.8", vega: "36.0" },
  { id: "BTC-260925-95000-P", strike: "95000", right: "P", last: 612.10, oi: 6800.00, usd: "1150200.00", delta: "−0.78", gamma: "0.000024", theta: "−21.0", vega: "36.0" },
  { id: "BTC-260925-100000-C", strike: "100000", right: "C", last: 74.20, oi: 1900.00, usd: "321500.00", delta: "0.09", gamma: "0.000012", theta: "−8.2", vega: "22.6" },
  { id: "BTC-260925-100000-P", strike: "100000", right: "P", last: 980.40, oi: 3400.00, usd: "575600.00", delta: "−0.91", gamma: "0.000012", theta: "−16.4", vega: "22.6" },
];
const INDEX_S = 91240;
const DEPTH = {
  asks: [[448, 1.1], [440, 0.8], [432, 2.0], [424, 1.4], [418, 0.6], [414, 0.9]],
  bids: [[411, 0.7], [406, 1.5], [398, 2.2], [390, 0.9], [382, 1.8], [374, 3.0]],
};
const BARS = (() => {
  const out = [];
  let c = 400;
  for (let i = 0; i < 80; i++) {
    const o = c;
    c = c + (Math.sin(i / 6) * 4) + ((i % 7) - 3) * 0.8;
    const h = Math.max(o, c) + 3 + (i % 4);
    const l = Math.min(o, c) - 3 - (i % 3);
    out.push({ t: i, o, h, l, c, v: 40 + (i * 13) % 120 });
  }
  return out;
})();
const S = {
  variant: "A", focus: "session",
  symbol: "BTC-260925-90000-C",
  entry: 412.8, sl: 380, tp: 448, qty: 2, side: "buy",
  dragging: null, ghost: null, toast: "", declared: false,
  calm: 0, conf: 0,
  und: "BTC", expiry: "260925", strike: "90000", right: "CE",
  maxLoss: "250", horizon: "three", days: 3, dte: 7,
  inv: "", legs: [], payHover: "",
};
const ICO = {
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7.5" y="5.5" width="9" height="14" rx="2"/><path d="M9.6 11h4.8M9.6 14h3.2"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13 3.4 6.4 13.2h5L10.2 20.6l7.2-10.4h-5.2z"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8.8 8h9M8.8 12h9M8.8 16h7"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.4"/></svg>',
};

function row() { return OI_ROWS.find(r => r.id === S.symbol) || OI_ROWS[2]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function contractId() { return `${S.und}-${S.expiry}-${S.strike}-${S.right === "PE" ? "P" : "C"}`; }
function planReady() {
  if (!(S.calm >= 1 && S.conf >= 1)) return "Need calm and confidence";
  if (!(+S.qty > 0 && S.und && S.strike)) return "Need contract and size";
  if (!String(S.inv).trim()) return "Write the invalidation";
  return null;
}
function bindSym(id) {
  const r = OI_ROWS.find(x => x.id === id);
  if (!r) return;
  S.symbol = id;
  const parts = id.split("-");
  S.und = parts[0];
  S.expiry = parts[1];
  S.strike = r.strike;
  S.right = r.right === "P" ? "PE" : "CE";
  S.entry = r.last;
}
function payoffAt(spot, K, prem, right, side, count) {
  const intrinsic = right === "C" ? Math.max(spot - K, 0) : Math.max(K - spot, 0);
  const unit = side === "buy" ? intrinsic - prem : prem - intrinsic;
  return unit * count;
}
function rung1() {
  const q = +S.qty || 0;
  if (!q) return null;
  const loss = S.side === "buy" ? (S.entry - S.sl) * q : (S.sl - S.entry) * q;
  return -Math.abs(loss);
}

function strip() {
  const r = row();
  const last = BARS[BARS.length - 1].c.toFixed(2);
  return `<div class="strip">
    <div class="cell"><div class="k">Last · your entry</div><div class="v">${r.last.toFixed(2)}</div><div class="s">market/quote · kline ${last}</div></div>
    <div class="cell"><div class="k">Index S</div><div class="v">${INDEX_S.toLocaleString()}</div><div class="s">eapi index · European</div></div>
    <div class="cell"><div class="k">Delta</div><div class="v">${r.delta}</div><div class="s">VenuePublished mark</div></div>
    <div class="cell"><div class="k">Gamma · Theta</div><div class="v">${r.gamma} · ${r.theta}</div><div class="s">not Black-76</div></div>
    <div class="cell"><div class="k">OI</div><div class="v">${r.oi}</div><div class="s">sumOpenInterest · this row</div></div>
    <div class="cell"><div class="k">Margin</div><div class="v dark">unavailable</div><div class="s">venue engine, not ours</div></div>
  </div>`;
}

function oiSVG(compact) {
  const max = Math.max(...OI_ROWS.map(r => r.oi));
  const w = compact ? 280 : 420, h = compact ? 90 : 140;
  const bars = OI_ROWS.map((r, i) => {
    const bw = (w - 24) / OI_ROWS.length;
    const bh = Math.max(5, (r.oi / max) * (h - 28));
    const x = 8 + i * bw;
    const y = h - 16 - bh;
    const on = r.id === S.symbol;
    const fill = r.right === "C" ? (on ? "#30d158" : "rgba(48,209,88,.45)") : (on ? "#ff453a" : "rgba(255,69,58,.45)");
    return `<rect x="${x}" y="${y}" width="${bw - 4}" height="${bh}" rx="3" fill="${fill}" data-act="sym" data-id="${r.id}" style="cursor:pointer"/>
      <text x="${x + (bw - 4) / 2}" y="${h - 4}" fill="rgba(245,245,247,.4)" font-size="8" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">${r.right}${String(r.strike).slice(0, 3)}</text>`;
  }).join("");
  return `<svg class="oiplot" viewBox="0 0 ${w} ${h}" role="img" aria-label="Open interest by contract">
    <text x="8" y="12" fill="rgba(245,245,247,.4)" font-size="9" font-family="ui-monospace,Menlo,monospace">sumOpenInterest · this expiry · not a total · not max pain</text>
    ${bars}
  </svg>`;
}

function paySVG(compact) {
  const r = row();
  const K = +r.strike;
  const prem = r.last;
  const q = +S.qty || 1;
  const right = r.right;
  const lo = K * 0.72, hi = K * 1.28;
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const spot = lo + (hi - lo) * i / 48;
    pts.push([spot, payoffAt(spot, K, prem, right, S.side, q)]);
  }
  const min = Math.min(...pts.map(p => p[1]), 0);
  const max = Math.max(...pts.map(p => p[1]), 0);
  const w = compact ? 280 : 420, h = compact ? 90 : 140;
  const pad = 16;
  const xOf = s => pad + ((s - lo) / (hi - lo)) * (w - pad * 2);
  const yOf = v => pad + (1 - (v - min) / (max - min || 1)) * (h - pad * 2);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${xOf(p[0]).toFixed(1)},${yOf(p[1]).toFixed(1)}`).join(" ");
  const kx = xOf(K), sx = xOf(INDEX_S);
  const z = yOf(0);
  const color = S.side === "buy" ? "#30d158" : "#ff453a";
  const openWing = right === "C" && S.side === "sell";
  return `<svg class="pay" viewBox="0 0 ${w} ${h}" role="img" aria-label="At expiry settlement"
      data-pay="1">
    <line x1="${pad}" y1="${z}" x2="${w - pad}" y2="${z}" stroke="rgba(255,255,255,.12)"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${kx}" cy="${z}" r="3" fill="#ff9f0a"/>
    <line x1="${sx}" y1="${pad}" x2="${sx}" y2="${h - pad}" stroke="rgba(100,210,255,.45)" stroke-dasharray="3 3"/>
    <text x="8" y="12" fill="rgba(245,245,247,.4)" font-size="9" font-family="ui-monospace,Menlo,monospace">European cash settle · S ${INDEX_S} · K ${K} · prem ${prem}${openWing ? " · short-call wing unbounded" : ""}</text>
  </svg>`;
}

function depthSVG() {
  const rows = [...DEPTH.asks].reverse().concat([{ mid: true }], DEPTH.bids);
  const h = 140, w = 280, rh = h / rows.length;
  let y = 0;
  const bits = [];
  DEPTH.asks.slice().reverse().forEach(([p, q]) => {
    bits.push(`<rect x="0" y="${y}" width="${w}" height="${rh - 1}" fill="rgba(255,69,58,${0.12 + q / 3 * 0.35})" data-act="depth" data-id="${p}"/>
      <text x="10" y="${y + rh * 0.7}" fill="#ff453a" font-size="10" font-family="ui-monospace,Menlo,monospace">${p}  ${q}</text>`);
    y += rh;
  });
  bits.push(`<rect x="0" y="${y}" width="${w}" height="${rh - 1}" fill="rgba(255,255,255,.08)"/>
    <text x="90" y="${y + rh * 0.7}" fill="#f5f5f7" font-size="10" font-family="ui-monospace,Menlo,monospace">spread</text>`);
  y += rh;
  DEPTH.bids.forEach(([p, q]) => {
    bits.push(`<rect x="0" y="${y}" width="${w}" height="${rh - 1}" fill="rgba(48,209,88,${0.12 + q / 3 * 0.35})" data-act="depth" data-id="${p}"/>
      <text x="10" y="${y + rh * 0.7}" fill="#30d158" font-size="10" font-family="ui-monospace,Menlo,monospace">${p}  ${q}</text>`);
    y += rh;
  });
  return `<svg class="depthsvg" viewBox="0 0 ${w} ${h}">${bits.join("")}</svg>`;
}

function layout() {
  const cv = document.getElementById("cv");
  const wrap = cv && cv.parentElement;
  if (!cv || !wrap) return null;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 8 || h < 8) return null;
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const volH = Math.round(h * 0.2);
  const plot = { x: 8, y: 8, w: w - 16, h: h - 16 - volH };
  const vol = { x: 8, y: h - volH - 4, w: plot.w, h: volH };
  return { ctx, w, h, plot, vol, volH };
}
function yRange() {
  let lo = Math.min(...BARS.map(b => b.l), S.sl, S.entry, S.tp);
  let hi = Math.max(...BARS.map(b => b.h), S.sl, S.entry, S.tp);
  const pad = (hi - lo) * 0.08;
  return { lo: lo - pad, hi: hi + pad };
}
function yAt(price, box, rng) { return box.y + (1 - (price - rng.lo) / (rng.hi - rng.lo)) * box.h; }
function priceAt(py, box, rng) { return rng.lo + (1 - (py - box.y) / box.h) * (rng.hi - rng.lo); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawLine(ctx, plot, rng, price, color, label, dashed) {
  const y = yAt(price, plot, rng);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.setLineDash(dashed ? [5, 4] : []);
  ctx.beginPath(); ctx.moveTo(plot.x, y); ctx.lineTo(plot.x + plot.w * 0.7, y); ctx.stroke();
  ctx.setLineDash([]);
  const pillX = plot.x + plot.w * 0.7;
  ctx.fillStyle = color;
  ctx.beginPath(); roundRect(ctx, pillX, y - 8, 72, 16, 7); ctx.fill();
  ctx.fillStyle = color === "#30d158" ? "#04210c" : "#fff";
  ctx.font = "600 10px ui-monospace, Menlo, monospace";
  ctx.fillText(label + " " + price.toFixed(1), pillX + 5, y + 3);
}

function drawSession() {
  const L = layout(); if (!L) return;
  const { ctx, w, h, plot, vol, volH } = L;
  ctx.clearRect(0, 0, w, h);
  const rng = yRange();
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  for (let i = 1; i < 4; i++) {
    const y = plot.y + (plot.h * i) / 4;
    ctx.beginPath(); ctx.moveTo(plot.x, y); ctx.lineTo(plot.x + plot.w, y); ctx.stroke();
  }
  const slot = plot.w / BARS.length;
  const bodyW = Math.max(2, slot * 0.55);
  BARS.forEach((b, i) => {
    const x = plot.x + slot * (i + 0.5);
    const up = b.c >= b.o;
    ctx.strokeStyle = up ? "#30d158" : "#ff453a";
    ctx.beginPath(); ctx.moveTo(x, yAt(b.h, plot, rng)); ctx.lineTo(x, yAt(b.l, plot, rng)); ctx.stroke();
    const top = Math.min(yAt(b.o, plot, rng), yAt(b.c, plot, rng));
    ctx.fillStyle = up ? "rgba(48,209,88,.9)" : "#ff453a";
    ctx.fillRect(x - bodyW / 2, top, bodyW, Math.max(1, Math.abs(yAt(b.c, plot, rng) - yAt(b.o, plot, rng))));
  });
  if (volH > 0) {
    const vmax = Math.max(...BARS.map(b => b.v));
    BARS.forEach((b, i) => {
      const x = vol.x + slot * (i + 0.5);
      const vh = (b.v / vmax) * (vol.h - 4);
      ctx.fillStyle = b.c >= b.o ? "rgba(48,209,88,.35)" : "rgba(255,69,58,.35)";
      ctx.fillRect(x - bodyW / 2, vol.y + vol.h - vh, bodyW, vh);
    });
  }
  if (S.ghost != null && S.dragging) {
    const gy = yAt(S.ghost, plot, rng);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(245,245,247,.28)";
    ctx.beginPath(); ctx.moveTo(plot.x, gy); ctx.lineTo(plot.x + plot.w * 0.7, gy); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawLine(ctx, plot, rng, S.entry, "#0a84ff", S.side === "buy" ? "BUY" : "SELL", false);
  drawLine(ctx, plot, rng, S.sl, "#ff453a", "SL", true);
  drawLine(ctx, plot, rng, S.tp, "#30d158", "TP", true);
}

function hitLine(py, L) {
  const rng = yRange();
  for (const [id, px] of [["sl", S.sl], ["tp", S.tp], ["entry", S.entry]]) {
    if (Math.abs(py - yAt(px, L.plot, rng)) < 8) return id;
  }
  return null;
}
function bindSession() {
  const cv = document.getElementById("cv");
  if (!cv) return;
  cv.onpointerdown = (e) => {
    const L = layout(); if (!L) return;
    const y = e.clientY - cv.getBoundingClientRect().top;
    const id = hitLine(y, L);
    if (!id) return;
    cv.setPointerCapture(e.pointerId);
    S.dragging = id; S.ghost = S[id];
    cv.style.cursor = "ns-resize";
    dump(); drawSession();
  };
  cv.onpointermove = (e) => {
    const L = layout(); if (!L) return;
    const y = e.clientY - cv.getBoundingClientRect().top;
    if (!S.dragging) { cv.style.cursor = hitLine(y, L) ? "ns-resize" : "default"; return; }
    const rng = yRange();
    S[S.dragging] = Math.max(rng.lo, Math.min(rng.hi, priceAt(y, L.plot, rng)));
    dump(); drawSession();
  };
  cv.onpointerup = () => {
    if (S.dragging) say("Commit " + S.dragging.toUpperCase() + " " + S[S.dragging].toFixed(2));
    S.dragging = null; S.ghost = null;
    cv.style.cursor = "default";
    const e = document.querySelector("input[data-act=entry]");
    const sl = document.querySelector("input[data-act=sl]");
    const tp = document.querySelector("input[data-act=tp]");
    if (e) e.value = S.entry.toFixed(2);
    if (sl) sl.value = S.sl.toFixed(2);
    if (tp) tp.value = S.tp.toFixed(2);
    dump(); drawSession();
  };
}

function bindPayoff() {
  document.querySelectorAll("svg.pay").forEach(svg => {
    svg.onmousemove = (e) => {
      const r = row();
      const box = svg.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width));
      const K = +r.strike;
      const spot = K * 0.72 + t * (K * 1.28 - K * 0.72);
      const pnl = payoffAt(spot, K, r.last, r.right, S.side, +S.qty || 1);
      const label = `S ${spot.toFixed(0)} · ${pnl >= 0 ? "+" : ""}${pnl.toFixed(1)} USDT at expiry`;
      S.payHover = label;
      const hov = svg.parentElement.querySelector(".hover");
      if (hov) hov.textContent = label;
      else {
        const d = document.createElement("div");
        d.className = "hover"; d.textContent = label;
        svg.parentElement.appendChild(d);
      }
    };
    svg.onmouseleave = () => { S.payHover = ""; const h = svg.parentElement.querySelector(".hover"); if (h) h.remove(); };
  });
}

function setVariant(k) {
  S.variant = k; S.toast = ""; S.dragging = null; S.ghost = null;
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u);
  paintChrome();
}
function cycle(d) { const i = VARIANTS.findIndex(v => v.key === S.variant); setVariant(VARIANTS[(i + d + 3) % 3].key); }
function say(m) {
  S.toast = m;
  const t = document.querySelector(".toast");
  if (t) { t.textContent = m; t.classList.add("on"); }
  setTimeout(() => { S.toast = ""; const x = document.querySelector(".toast"); if (x) x.classList.remove("on"); }, 1400);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  const act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (act === "prev") cycle(-1);
  if (act === "next") cycle(1);
  if (act === "hide") say("⌥Space hides the island. This is not live Notch.");
  if (act === "sym") { bindSym(id); paintChrome(); }
  if (act === "focus") { S.focus = id; paintChrome(); }
  if (act === "depth") { S.entry = +id; say("Limit " + id + " · not placed"); paintChrome(); }
  if (act === "side") { S.side = id; paintChrome(); }
  if (act === "calm") { S.calm = +id; paintChrome(); }
  if (act === "conf") { S.conf = +id; paintChrome(); }
  if (act === "right") { S.right = id; bindSym(contractId()); paintChrome(); }
  if (act === "horizon") {
    S.horizon = id;
    S.days = id === "today" ? 1 : id === "expiry" ? S.dte : 3;
    paintChrome();
  }
  if (act === "addleg") {
    if (+S.qty > 0 && S.und && S.strike) {
      S.legs.push({ und: S.und, expiry: S.expiry, strike: S.strike, right: S.right, side: S.side.toUpperCase(), qty: +S.qty });
      paintChrome();
    } else say("Need underlying, strike, contracts");
  }
  if (act === "rmleg") { S.legs.splice(+id, 1); paintChrome(); }
  if (act === "declare") {
    const h = planReady();
    if (h) { say(h); return; }
    if (S.declared) { say("clientToken held · no second send"); return; }
    S.declared = true; say("Declaration on file · waiting for fill · " + contractId()); paintChrome();
  }
});
document.addEventListener("input", (e) => {
  const act = e.target.getAttribute("data-act");
  if (!act) return;
  if (act === "und") S.und = e.target.value.toUpperCase();
  if (act === "expiry") S.expiry = e.target.value;
  if (act === "strike") S.strike = e.target.value;
  if (act === "qty") S.qty = e.target.value;
  if (act === "maxLoss") S.maxLoss = e.target.value;
  if (act === "inv") S.inv = e.target.value;
  if (act === "entry") { S.entry = parseFloat(e.target.value) || S.entry; drawSession(); }
  if (act === "sl") { S.sl = parseFloat(e.target.value) || S.sl; drawSession(); }
  if (act === "tp") { S.tp = parseFloat(e.target.value) || S.tp; drawSession(); }
  dump();
});
document.addEventListener("pointerdown", (e) => { const el = e.target.closest(".press"); if (el) el.classList.add("is-down"); }, true);
document.addEventListener("pointerup", () => document.querySelectorAll(".press.is-down").forEach(el => el.classList.remove("is-down")));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
window.addEventListener("resize", () => drawSession());
const boot = new URLSearchParams(location.search).get("variant") || "A";
S.variant = VARIANTS.some(v => v.key === boot) ? boot : "A";
paintChrome();
</script>
