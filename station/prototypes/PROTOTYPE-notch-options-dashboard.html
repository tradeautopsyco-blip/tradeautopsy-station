<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. UI sub-shape A on this cockpit.
  Question: Live/Post as Notch chrome (escrow · capture · Moments A–C), ticket-keyed,
  DualNoBlend, TRADE parked — with TradingView card language on the board.
  Three layouts via ?flow=A|B|C. Ticket chrome still ?ticket=A|B|C.
  Run: ./serve-prototype.sh → ?asset=usdm&board=cockpit&ticket=A&flow=A
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Notch · Live / Post</title>
  <style>
    /* Apple Design System — Notch options cockpit
       Dark desk is the product look. Light is opt-in via html[data-theme="light"].
       Animate transform/opacity only. No motion on high-frequency tab/asset switches. */
    :root {
      color-scheme: dark;
      --bg-primary: #000000;
      --bg-secondary: #1d1d1f;
      --bg-elevated: #2c2c2e;
      --bg-sheet: #0c0c0e;
      --bg-tile: #1c1c1e;
      --bg-input: rgba(255, 255, 255, 0.06);
      --label: #f5f5f7;
      --sec: #a1a1a6;
      --ter: rgba(245, 245, 247, 0.42);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --accent-blue: #0a84ff;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --accent-orange: #ff9f0a;
      --accent-teal: #64d2ff;
      --accent-mint: #63e6be;
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --teal: #64d2ff;
      --live: #63e6be;
      --border-color: rgba(255, 255, 255, 0.1);
      --hairline: rgba(255, 255, 255, 0.08);
      --glass: rgba(22, 22, 24, 0.72);
      --glass-heavy: rgba(28, 28, 30, 0.82);
      --glass-border: rgba(255, 255, 255, 0.18);
      --fill-hover: rgba(255, 255, 255, 0.08);
      --fill-active: rgba(255, 255, 255, 0.14);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24), 0 1px 4px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.32);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.36), 0 16px 32px rgba(0, 0, 0, 0.22);
      --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.45);
      --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      --duration-press: 160ms;
      --duration-fast: 150ms;
      --duration-base: 220ms;
      --duration-slow: 400ms;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-elevated: #ffffff;
      --bg-sheet: #ffffff;
      --bg-tile: #ffffff;
      --bg-input: rgba(0, 0, 0, 0.04);
      --label: #1d1d1f;
      --sec: #86868b;
      --ter: rgba(29, 29, 31, 0.42);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --accent-blue: #0071e3;
      --blue: #0071e3;
      --border-color: rgba(0, 0, 0, 0.1);
      --hairline: rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.72);
      --glass-heavy: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.45);
      --fill-hover: rgba(0, 0, 0, 0.05);
      --fill-active: rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08), 0 16px 32px rgba(0, 0, 0, 0.08);
      --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.12);
      --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { background: var(--bg-primary); }
    body {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: var(--label);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 48% at 50% -18%, #2a2a32 0%, transparent 58%),
        var(--bg-primary);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
    ::selection { background: rgba(10, 132, 255, 0.35); color: var(--label); }
    .press {
      transition: transform var(--duration-press) var(--ease-out);
    }
    .press:active, .press.is-down { transform: scale(0.97); }

    .osbar {
      height: 24px;
      display: grid;
      grid-template-columns: 1fr 244px 1fr;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--border-color);
    }
    .osbar .l, .osbar .r {
      display: flex; align-items: center; color: var(--sec); padding: 0 10px; font-size: 13px;
    }
    .osbar .r { justify-content: flex-end; }
    .osbar span { padding: 0 8px; }
    .island {
      height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
      background: #000; color: #fff;
      clip-path: path("M0,0 Q6,0 6,6 L6,10 Q6,24 20,24 L224,24 Q238,24 238,10 L238,6 Q238,0 244,0 Z");
      font: 600 11px/1 var(--mono);
    }
    .island .mark {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      display: grid; place-items: center; font: 700 9px/1 var(--sans);
    }
    .island b { margin-left: auto; font-variant-numeric: tabular-nums; }

    .desk { height: calc(100% - 24px); padding: 16px 16px 88px; }
    body.is-edit .desk, body.phase-plan .desk { padding-bottom: 148px; }
    .sheet {
      width: 100%; height: 100%;
      border-radius: var(--radius-2xl);
      overflow: hidden;
      display: flex;
      background: var(--bg-sheet);
      box-shadow: var(--shadow-inset), var(--shadow-xl);
      border: 0.5px solid var(--hairline);
    }
    .rail {
      width: 184px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-right: 0.5px solid var(--border-color);
    }
    .rail .k {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ter); padding: 16px 16px 8px; font-weight: 600;
    }
    .nav {
      display: flex; align-items: center; gap: 10px; margin: 0 12px;
      padding: 10px 12px; border-radius: var(--radius-md);
      color: var(--sec); text-align: left; width: calc(100% - 24px);
      min-height: 44px;
      transition: background-color var(--duration-fast) ease, color var(--duration-fast) ease;
    }
    .nav.on { background: var(--fill-active); color: var(--label); font-weight: 600; }
    .nav svg { width: 16px; height: 16px; }
    .hide { margin-top: auto; padding: 12px 18px; color: var(--ter); font-size: 13px; }
    .apill {
      margin: 8px; padding: 10px 12px; border-radius: var(--radius-md);
      background: var(--bg-input); font-size: 11px; color: var(--sec);
      display: flex; align-items: center; gap: 8px;
    }
    .apill i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-teal); }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; gap: 8px; padding: 16px 20px 8px; }
    .top h1 {
      font-size: clamp(1.0625rem, 1.4vw, 1.375rem);
      font-weight: 600; letter-spacing: -0.022em; line-height: 1.15;
    }
    .sp { flex: 1; }
    .chip {
      font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full);
      background: var(--fill-hover); color: var(--sec); font-weight: 500;
    }
    .chip.warn { color: var(--orange); background: rgba(255, 159, 10, 0.14); }
    .chip.on { color: var(--label); background: var(--fill-active); }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
    .tab {
      padding: 8px 14px; border-radius: var(--radius-full);
      background: var(--bg-tile); color: var(--sec); font-size: 12px; font-weight: 500;
      flex-shrink: 0; min-height: 32px;
      box-shadow: var(--shadow-inset);
      transition: background-color var(--duration-fast) ease, color var(--duration-fast) ease;
    }
    .tab.on { background: var(--fill-active); color: var(--label); font-weight: 600; }

    .strip {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;
      padding: 0 16px 12px;
    }
    .strip.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cell {
      background: var(--bg-tile);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm), var(--shadow-inset);
      border: 0.5px solid var(--hairline);
    }
    .cell .k {
      font: 500 10px/1 var(--mono); letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ter);
    }
    .cell .v {
      font: 600 15px/1.25 var(--sans); letter-spacing: -0.02em;
      margin-top: 6px; font-variant-numeric: tabular-nums;
    }
    .cell .s { font: 400 10px/1.3 var(--mono); color: var(--ter); margin-top: 4px; }
    .dark { color: var(--ter); }

    .work { flex: 1; min-height: 0; display: flex; padding: 0 16px 16px; gap: 12px; }
    .work.col { flex-direction: column; }
    .board { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    .mosaic {
      flex: 1; min-height: 0; position: relative;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows, 5), minmax(96px, 1fr));
      gap: 10px;
      overflow: auto;
    }
    .mosaic.empty::after {
      content: "Add a tile from the catalog. Plan stays.";
      position: absolute; inset: 0; display: grid; place-items: center;
      font: 500 13px/1.4 var(--sans); color: var(--ter);
      border-radius: var(--radius-lg); box-shadow: inset 0 0 0 0.5px var(--hairline);
      pointer-events: none;
    }
    .tile {
      background: var(--bg-tile);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      box-shadow: var(--shadow-sm), var(--shadow-inset);
      border: 0.5px solid var(--hairline);
      grid-column: var(--x) / span var(--w);
      grid-row: var(--y) / span var(--h);
      position: relative;
      transition: transform var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    body.is-edit .tile { box-shadow: var(--shadow-md), inset 0 0 0 0.5px rgba(255, 255, 255, 0.18); }
    .tile.ghost {
      box-shadow: inset 0 0 0 1.5px rgba(100, 210, 255, 0.55);
      background: rgba(100, 210, 255, 0.08);
    }
    .tile.bad { box-shadow: inset 0 0 0 1.5px rgba(255, 69, 58, 0.7); }
    .ph {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px 0; gap: 8px; flex-shrink: 0;
    }
    body.is-edit .ph { cursor: grab; }
    body.is-edit .ph:active { cursor: grabbing; }
    .ph b { font-size: 13px; font-weight: 600; letter-spacing: -0.015em; }
    .ph span { font: 400 10px/1.2 var(--mono); color: var(--ter); }
    .ph .rm {
      width: 28px; height: 28px; border-radius: var(--radius-sm); flex-shrink: 0;
      background: var(--fill-hover); color: var(--sec); font-size: 16px; line-height: 1;
    }
    .body { flex: 1; min-height: 0; position: relative; }
    body.is-edit .body { pointer-events: none; }
    canvas { display: block; width: 100%; height: 100%; background: transparent; }
    .oiplot, .pay, .depthsvg { width: 100%; height: 100%; display: block; }
    .hover {
      position: absolute; left: 12px; bottom: 10px;
      font: 500 11px/1.3 var(--mono); color: var(--accent-teal); pointer-events: none;
    }
    .handle {
      position: absolute; right: 6px; bottom: 6px; width: 12px; height: 12px;
      border-radius: 2px; cursor: nwse-resize; z-index: 3;
      background: linear-gradient(135deg, transparent 50%, rgba(245, 245, 247, 0.45) 50%);
    }
    .chainbox { height: 100%; overflow-x: hidden; overflow-y: scroll; }
    table { width: 100%; border-collapse: collapse; font: 400 11px/1.35 var(--mono); }
    th { text-align: left; color: var(--ter); font-weight: 500; padding: 8px 12px; }
    td {
      padding: 8px 12px; border-top: 0.5px solid var(--hairline);
      font-variant-numeric: tabular-nums;
    }
    tr.on td { background: rgba(10, 132, 255, 0.1); }
    td button { font: inherit; color: var(--label); }

    .greeks {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
      background: var(--hairline); border-radius: var(--radius-md); overflow: hidden; margin: 8px;
    }
    .greeks div { background: var(--bg-tile); padding: 10px 12px; }
    .greeks .k { font: 500 9px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ter); }
    .greeks .v { font: 600 14px/1.3 var(--sans); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .scroll { height: 100%; overflow-x: hidden; overflow-y: scroll; padding: 4px 12px 12px; }
    .riskbody { height: 100%; display: flex; flex-direction: column; padding: 8px 14px 12px; }
    .riskbody .v {
      font: 600 clamp(1.25rem, 2vw, 1.75rem)/1.05 var(--sans);
      letter-spacing: -0.03em; margin-top: 6px; font-variant-numeric: tabular-nums;
    }
    .riskbody .s { font: 400 10px/1.3 var(--mono); color: var(--ter); margin-top: auto; padding-top: 6px; }
    .detect {
      margin: 0 16px 8px; padding: 10px 14px; border-radius: var(--radius-md);
      background: var(--bg-tile); box-shadow: var(--shadow-sm), var(--shadow-inset);
      display: flex; align-items: center; gap: 10px; font-size: 12px;
    }
    .detect.bad { box-shadow: inset 0 0 0 0.5px rgba(255, 69, 58, 0.55); }
    .detect.warn { box-shadow: inset 0 0 0 0.5px rgba(255, 159, 10, 0.45); }
    .pathwrap { height: 100%; background: var(--bg-tile); position: relative; overflow: hidden; min-height: 0; }
    .pathwrap canvas { width: 100%; height: 100%; display: block; }
    .pathmeta { position: absolute; left: 14px; top: 12px; z-index: 2; pointer-events: none; }
    .pathmeta .k { font: 500 10px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ter); }
    .pathmeta .v { font: 600 24px/1 var(--sans); letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pathmeta .v.dn { color: var(--red); }
    .pathmeta .v.up { color: var(--green); }
    .pathmeta .s { font: 400 11px/1.3 var(--mono); color: var(--ter); margin-top: 6px; }
    body.is-risk .edit-tray { display: none; }

    .side {
      width: min(320px, 34vw); flex-shrink: 0;
      overflow-x: hidden; overflow-y: scroll;
      background: var(--glass-heavy);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      padding: 16px 16px 20px;
      box-shadow: var(--shadow-md), var(--shadow-inset);
      border: 0.5px solid var(--glass-border);
    }
    .floor {
      height: 210px; flex-shrink: 0;
      display: grid; grid-template-columns: 1.1fr 1.1fr 1fr 1.2fr; gap: 8px;
      overflow: hidden;
    }
    .floor .pane {
      background: var(--bg-tile); border-radius: var(--radius-lg);
      overflow-x: hidden; overflow-y: scroll; padding: 12px;
      box-shadow: var(--shadow-sm), var(--shadow-inset);
      border: 0.5px solid var(--hairline);
    }
    .zone { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .znote { font-size: 11px; font-family: var(--mono); color: var(--ter); margin: 4px 0 14px; }
    .side h2, .floor h2 {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ter); margin: 16px 0 8px; font-weight: 600;
    }
    .srow {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums;
    }
    .cta {
      width: 100%; height: 44px; border-radius: var(--radius-full);
      font-weight: 600; margin-top: 12px;
      background: var(--accent-green); color: #04210c;
      box-shadow: 0 8px 24px rgba(48, 209, 88, 0.22);
      transition: transform var(--duration-press) var(--ease-out), box-shadow var(--duration-base) var(--ease-out);
    }
    .cta.ghost {
      background: var(--fill-active); color: var(--label);
      box-shadow: none;
    }
    .cta:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
    .note { font-size: 11px; color: var(--ter); margin-top: 8px; font-family: var(--mono); }
    .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
    .feel button {
      min-height: 36px; padding: 6px 2px; border-radius: var(--radius-md);
      text-align: center; background: var(--bg-tile);
      box-shadow: var(--shadow-inset); border: 0.5px solid var(--hairline);
      transition: background-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
    }
    .feel button.on {
      background: rgba(10, 132, 255, 0.14);
      box-shadow: inset 0 0 0 0.5px rgba(10, 132, 255, 0.5);
    }
    .feel b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .feel span { font-size: 9px; color: var(--ter); }
    .field { margin-bottom: 8px; }
    .field span {
      display: block; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ter); margin-bottom: 6px; font-weight: 600;
    }
    .field input, .field textarea {
      width: 100%; padding: 10px 12px; min-height: 40px;
      border-radius: var(--radius-md);
      background: var(--bg-input); color: var(--label);
      box-shadow: var(--shadow-inset); font: 400 13px/1.35 var(--mono);
      border: 0.5px solid var(--hairline);
      transition: box-shadow var(--duration-fast) ease;
    }
    .field input:focus, .field textarea:focus,
    .linkfld input:focus, .moment input:focus, .moment textarea:focus, .namebox input:focus {
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.22);
    }
    .field textarea { min-height: 64px; resize: vertical; font-family: var(--sans); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chipbtn {
      padding: 8px 12px; min-height: 32px; border-radius: var(--radius-full);
      background: var(--fill-hover); color: var(--sec); font-size: 12px; font-weight: 590;
      transition: background-color var(--duration-fast) ease, color var(--duration-fast) ease;
    }
    .chipbtn.on { background: var(--fill-active); color: var(--label); }
    .leg {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: var(--radius-md);
      background: var(--bg-tile); margin-bottom: 6px; font-size: 12px;
      border: 0.5px solid var(--hairline);
    }
    .leg b { font-family: var(--mono); }
    .ready { font-size: 11px; color: var(--ter); text-align: right; margin-top: 6px; font-family: var(--mono); }
    .rung {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 0.5px solid var(--hairline); font-size: 12px;
    }
    .rung .sub { font: 400 10px/1.2 var(--mono); color: var(--ter); }
    .chip.darkish { color: var(--ter); }

    .toast {
      position: absolute; left: 50%; top: 48px; z-index: 20;
      padding: 10px 16px; min-height: 36px;
      border-radius: var(--radius-full);
      background: var(--glass-heavy);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg), var(--shadow-inset);
      opacity: 0; pointer-events: none;
      transform: translateX(-50%) translateY(-6px) scale(0.97);
      transition: opacity var(--duration-base) var(--ease-out), transform var(--duration-base) var(--ease-out);
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    .switchers {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
      display: flex; align-items: center; gap: 10px;

function defaultTicket(book) {
  const spec = ticketSpec();
  return {
    book,
    type: spec.defaultType,
    sizeMode: spec.defaultSizeMode,
    tif: "GTC",
    reduceOnly: false,
    postOnly: false,

}
function persistTicket() {
  const book = A().book;
  S.byBook[book] = {
    book,
    type: S.orderType,
    sizeMode: S.sizeMode,
    tif: S.tif,
    reduceOnly: S.reduceOnly,
    postOnly: S.postOnly,
    quoteQty: S.quoteQty,
    triggerPrice: S.triggerPrice,
  };
}
function adoptTicket(book) {
  if (!hasVenueTicket()) {
    S.orderType = "LIMIT";
    S.sizeMode = "base";
    S.tif = "GTC";
    S.reduceOnly = false;
    S.postOnly = false;
    S.quoteQty = null;
    S.triggerPrice = "";
    return;
  }
  const fresh = defaultTicket(book);
  const prev = S.byBook[book];
  const t = prev && prev.book === book ? { ...fresh, ...prev, book } : fresh;
  S.byBook[book] = t;
  S.orderType = t.type;
  S.sizeMode = t.sizeMode;
  S.tif = t.tif;
  S.reduceOnly = !!t.reduceOnly;
  S.postOnly = !!t.postOnly;
  S.quoteQty = t.quoteQty;
  S.triggerPrice = t.triggerPrice || "";
  coerceTicket();
}
function coerceTicket() {
  const spec = ticketSpec();
  if (!spec.types.includes(S.orderType)) S.orderType = spec.defaultType;
  if (!spec.sizeModes.includes(S.sizeMode)) S.sizeMode = spec.defaultSizeMode;
  if (S.asset !== "spot") S.quoteQty = null;
  if (S.asset === "spot" && S.sizeMode === "quote") S.qtyOverride = S.quoteQty;
  persistTicket();
}

  if ((S.asset === "usdm" || S.asset === "coinm") && S.sizeMode === "quote") reasons.push("no quoteOrderQty");
  if (S.asset === "spot" && S.sizeMode === "quote" && S.sizeMode === "base") reasons.push("size XOR");
  if (S.asset === "spot" && S.sizeMode === "quote" && !(+S.quoteQty > 0) && !(+S.qty > 0)) reasons.push("need quoteOrderQty");
  return reasons.length ? reasons.join(" · ") : null;
}

function layout() {
  const cv = document.getElementById("cv");
  const wrap = cv && cv.parentElement;
  if (!cv || !wrap) return null;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 8 || h < 8) return null;
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const volH = Math.round(h * 0.2);
  const plot = { x: 8, y: 8, w: w - 16, h: h - 16 - volH };
  const vol = { x: 8, y: h - volH - 4, w: plot.w, h: volH };
  return { ctx, w, h, plot, vol, volH };
}
function yRange() {
  const series = bars();
  let lo = Math.min(...series.map(b => b.l), S.sl, S.entry, S.tp);
  let hi = Math.max(...series.map(b => b.h), S.sl, S.entry, S.tp);
  const pad = (hi - lo) * 0.08;
  return { lo: lo - pad, hi: hi + pad };
}
function yAt(price, box, rng) { return box.y + (1 - (price - rng.lo) / (rng.hi - rng.lo)) * box.h; }
function priceAt(py, box, rng) { return rng.lo + (1 - (py - box.y) / box.h) * (rng.hi - rng.lo); }
function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x + w, y, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawLine(ctx, plot, rng, price, color, label, dashed) {
  const y = yAt(price, plot, rng);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.setLineDash(dashed ? [5, 4] : []);
  ctx.beginPath(); ctx.moveTo(plot.x, y); ctx.lineTo(plot.x + plot.w * 0.7, y); ctx.stroke();
  ctx.setLineDash([]);
  const pillX = plot.x + plot.w * 0.7;
  ctx.fillStyle = color;
  ctx.beginPath(); roundRect(ctx, pillX, y - 8, 72, 16, 7); ctx.fill();
  ctx.fillStyle = color === "#30d158" ? "#04210c" : "#fff";
  ctx.font = "600 10px ui-monospace, Menlo, monospace";
  ctx.fillText(label + " " + price.toFixed(1), pillX + 5, y + 3);
}
function drawPath(id, signedDelta, endLabel) {
  const cv = document.getElementById(id);
  const wrap = cv && cv.parentElement;
  if (!cv || !wrap) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 8 || h < 8) return;
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const eq = A().equity;
  const end = eq + signedDelta;
  const span = Math.max(Math.abs(signedDelta) * 2.2, eq * 0.03);
  const top = Math.max(eq, end) + span * 0.12;
  const bot = Math.min(eq, end) - span * 0.12;
  const y = v => 28 + (1 - (v - bot) / (top - bot || 1)) * (h - 56);
  const x0 = 36, x1 = w - 28;
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.beginPath(); ctx.moveTo(x0, y(eq)); ctx.lineTo(x1, y(eq)); ctx.stroke();
  ctx.strokeStyle = signedDelta >= 0 ? "#30d158" : "#ff453a";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(x0, y(eq));
  ctx.lineTo(x0 + (x1 - x0) * 0.35, y(eq));
  ctx.lineTo(x1, y(end));
  ctx.stroke();
  ctx.fillStyle = "rgba(245,245,247,.62)";
  ctx.font = "500 11px ui-monospace, Menlo, monospace";
  ctx.fillText("now " + moneyFmt(eq, 0), x0, y(eq) - 8);
  const endY = y(end);
  ctx.fillText(endLabel + " " + moneyFmt(end, 0), Math.max(x0, x1 - 118), endY + (signedDelta >= 0 ? -8 : 14));
}
function drawDeclaredPaths() {
  if (S.phase !== "live" || S.flow !== "A") return;
  const e = engine();
  drawPath("pathcv", e.atStop == null ? 0 : -e.atStop, "if SL");
  drawPath("pathcv-tp", e.atTarget == null ? 0 : e.atTarget, "if TP");
}
function drawSession() {
  const L = layout(); if (!L) return;
  const { ctx, w, h, plot, volH } = L;
  ctx.clearRect(0, 0, w, h);
  const tileFill = (getComputedStyle(document.documentElement).getPropertyValue("--bg-tile") || "#1c1c1e").trim();
  ctx.fillStyle = tileFill || "#1c1c1e";
  ctx.fillRect(0, 0, w, h);
  const rng = yRange();
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  for (let i = 1; i < 4; i++) {
    const y = plot.y + (plot.h * i) / 4;
    ctx.beginPath(); ctx.moveTo(plot.x, y); ctx.lineTo(plot.x + plot.w, y); ctx.stroke();
  }
  const series = bars();
  const slot = plot.w / series.length;
  const bodyW = Math.max(2, slot * 0.55);
  series.forEach((b, i) => {
    const x = plot.x + slot * (i + 0.5);
    const up = b.c >= b.o;
    ctx.strokeStyle = up ? "#30d158" : "#ff453a";
    ctx.beginPath(); ctx.moveTo(x, yAt(b.h, plot, rng)); ctx.lineTo(x, yAt(b.l, plot, rng)); ctx.stroke();
    const top = Math.min(yAt(b.o, plot, rng), yAt(b.c, plot, rng));
    ctx.fillStyle = up ? "rgba(48,209,88,.9)" : "#ff453a";
    ctx.fillRect(x - bodyW / 2, top, bodyW, Math.max(1, Math.abs(yAt(b.c, plot, rng) - yAt(b.o, plot, rng))));
  });
  if (volH > 0) {
    const vmax = Math.max(...series.map(b => b.v));
    series.forEach((b, i) => {
      const x = L.vol.x + slot * (i + 0.5);
      const vh = (b.v / vmax) * (L.vol.h - 4);
      ctx.fillStyle = b.c >= b.o ? "rgba(48,209,88,.35)" : "rgba(255,69,58,.35)";
      ctx.fillRect(x - bodyW / 2, L.vol.y + L.vol.h - vh, bodyW, vh);
    });
  }
  if (S.ghost != null && S.dragging) {
    const gy = yAt(S.ghost, plot, rng);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(245,245,247,.28)";
    ctx.beginPath(); ctx.moveTo(plot.x, gy); ctx.lineTo(plot.x + plot.w * 0.7, gy); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawLine(ctx, plot, rng, S.entry, "#0a84ff", S.side === "buy" ? "BUY" : "SELL", false);
  drawLine(ctx, plot, rng, S.sl, "#ff453a", "SL", true);
  drawLine(ctx, plot, rng, S.tp, "#30d158", "TP", true);
}
function hitLine(py, L) {
  const rng = yRange();
  for (const [id, px] of [["sl", S.sl], ["tp", S.tp], ["entry", S.entry]]) {
    if (Math.abs(py - yAt(px, L.plot, rng)) < 8) return id;
  }
  return null;
}
function bindSession() {
  const cv = document.getElementById("cv");
  if (!cv || S.edit) return;
  cv.onpointerdown = (e) => {
    const L = layout(); if (!L) return;
    const y = e.clientY - cv.getBoundingClientRect().top;
    const id = hitLine(y, L);
    if (!id) return;
    cv.setPointerCapture(e.pointerId);
    S.dragging = id; S.ghost = S[id];
    cv.style.cursor = "ns-resize";
    dump(); drawSession();
  };
  cv.onpointermove = (e) => {
    const L = layout(); if (!L) return;
    const y = e.clientY - cv.getBoundingClientRect().top;
    if (!S.dragging) { cv.style.cursor = hitLine(y, L) ? "ns-resize" : "default"; return; }
    const rng = yRange();
    S[S.dragging] = Math.max(rng.lo, Math.min(rng.hi, priceAt(y, L.plot, rng)));
    dump(); drawSession();
  };
  cv.onpointerup = () => {
    if (S.dragging) say("Commit " + S.dragging.toUpperCase() + " " + S[S.dragging].toFixed(2));
    S.dragging = null; S.ghost = null;
    cv.style.cursor = "default";
    const e = document.querySelector("input[data-act=entry]");
    const sl = document.querySelector("input[data-act=sl]");
    const tp = document.querySelector("input[data-act=tp]");
    if (e) e.value = S.entry.toFixed(2);
    if (sl) sl.value = S.sl.toFixed(2);
    if (tp) tp.value = S.tp.toFixed(2);
    paint();
  };
}

function bindPayoff() {
  if (S.edit) return;
  document.querySelectorAll("svg.pay").forEach(svg => {
    svg.onmousemove = (e) => {
      const r = row();
      const box = svg.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width));
      const K = +r.strike;
      const spot = K * 0.72 + t * (K * 1.28 - K * 0.72);
      const pnl = payoffAt(spot, K, r.last, r.right, S.side, +S.qty || 1);
      const label = `S ${spot.toFixed(0)} · ${pnl >= 0 ? "+" : ""}${pnl.toFixed(1)} ${money()} at expiry`;
      S.payHover = label;
      const hov = svg.parentElement.querySelector(".hover");
      if (hov) hov.textContent = label;
      else {
        const d = document.createElement("div");
        d.className = "hover"; d.textContent = label;
        svg.parentElement.appendChild(d);
      }
    };
    svg.onmouseleave = () => { S.payHover = ""; const h = svg.parentElement.querySelector(".hover"); if (h) h.remove(); };
  });
}

function cellAt(px, py) {
  const mosaic = document.getElementById("mosaic");
  if (!mosaic) return null;
  const r = mosaic.getBoundingClientRect();
  const tiles = board().tiles;
  const rows = rowCount(tiles);
  const gap = 8;
  const colW = (r.width - gap * (COLS - 1)) / COLS;
  const rowH = (r.height - gap * (rows - 1)) / rows;
  const x = Math.max(0, Math.min(COLS - 1, Math.floor((px - r.left) / (colW + gap))));
  const y = Math.max(0, Math.floor((py - r.top) / (rowH + gap)));
  return { x, y };
}

function bindEdit() {
  if (!S.edit) return;
  const mosaic = document.getElementById("mosaic");
  if (!mosaic) return;
  mosaic.querySelectorAll("[data-move]").forEach(el => {
    el.onpointerdown = (e) => {
      if (e.target.closest("[data-act=rmtile]")) return;
      const kind = el.getAttribute("data-move");
      const t = board().tiles.find(x => x.kind === kind);
      if (!t) return;
      el.setPointerCapture(e.pointerId);
      S.tileDrag = { kind, ox: t.x, oy: t.y, w: t.w, h: t.h };
      S.dropBad = false;
    };
  });
  mosaic.querySelectorAll("[data-resize]").forEach(el => {
    el.onpointerdown = (e) => {
      e.stopPropagation();
      const kind = el.getAttribute("data-resize");
      const t = board().tiles.find(x => x.kind === kind);
      if (!t) return;
      el.setPointerCapture(e.pointerId);
      S.tileResize = { kind, ox: t.x, oy: t.y, ow: t.w, oh: t.h, px: e.clientX, py: e.clientY };
    };
  });
}

function commitGeometry() {
  persist();
  paint();
}

function addTile(kind) {
  const meta = kindMeta(kind);
  if (!meta) { say("Not on this class"); return; }
  const b = board();
  if (b.tiles.some(t => t.kind === kind)) { say("Already on the board"); return; }
  const hole = firstHole(b.tiles, meta.addW, meta.addH);
  b.tiles.push({ kind, x: hole.x, y: hole.y, w: hole.w, h: hole.h });
  persist();
  paint();
}

function removeTile(kind) {
  const b = board();
  b.tiles = b.tiles.filter(t => t.kind !== kind);
  persist();
  paint();
}

function setDock(dock) {
  board().planDock = dock === "floor" ? "floor" : "rail";
  persist();
  paint();
}

function slugName(name) {
  const s = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s || "board";
}
function uniqueId(base) {
  let id = base, n = 2;
  while (S.boards[id]) { id = base + "-" + n; n++; }
  return id;
}

function saveAs(name) {
  const label = String(name || "").trim();
  if (!label) { say("Name the board"); return; }
  const id = uniqueId(slugName(label));
  const src = board();
  S.boards[id] = {
    id, name: label, seed: false, planDock: src.planDock,
    blurb: `${src.tiles.length} tiles · Plan ${src.planDock}`,
    tiles: cloneTiles(src.tiles),
    origin: cloneTiles(src.tiles),
    originDock: src.planDock,
  };
  S.order.push(id);
  S.boardId = id;
  persist();
  S.naming = false;
  document.getElementById("namebox").classList.remove("on");
  say("Saved " + label);
  paint();
}

function resetBoard() {
  const cur = board();
  const seed = seeds().find(s => s.id === cur.id);
  if (seed) {
    S.boards[cur.id] = seedClone(seed);
  } else if (cur.origin) {
    cur.tiles = cloneTiles(cur.origin);
    cur.planDock = cur.originDock || cur.planDock;
  } else {
    say("Nothing to reset");
    return;
  }
  persist();
  say("Reset " + S.boards[S.boardId].name);
  paint();
}

function deleteBoard() {
  const cur = board();
  if (cur.seed) { say("Seeds cannot be deleted"); return; }
  delete S.boards[cur.id];
  S.order = S.order.filter(id => id !== cur.id);
  S.boardId = "cockpit";
  persist();
  say("Deleted");
  paint();
}

function switchBoard(id) {
  if (!S.boards[id]) { say("Unknown board"); S.boardId = "cockpit"; persist(); paint(); return; }
  S.boardId = id;
  S.declared = false;
  resetLive();
  persist();
  paint();
}

function cycle(d) {
  const i = S.order.indexOf(S.boardId);
  const n = S.order.length;
  switchBoard(S.order[(i + d + n) % n]);
}

function setEdit(on) {
  S.edit = !!on;
  S.tileDrag = null;
  S.tileResize = null;
  S.dragging = null;
  paint();
}

function say(m) {
  S.toast = m;
  const t = document.querySelector(".toast");
  if (t) { t.textContent = m; t.classList.add("on"); }
  setTimeout(() => { S.toast = ""; const x = document.querySelector(".toast"); if (x) x.classList.remove("on"); }, 1400);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  const act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (act === "prev") cycle(-1);
  if (act === "next") cycle(1);
  if (act === "hide") say("⌥Space hides the island. This is not live Notch.");
  if (act === "edit") setEdit(!S.edit);
  if (act === "asset") switchAsset(id);
  if (act === "optdesk") {
    if (id === "nfo") {
      S.nfoKind = S.nfoKind || "opt";
      applyNfoProduct();
      S.declared = false;
      resetLive();
    } else {
      applyQuote("options");
      adoptAssetSlice("options");
    }
    persist();
    paint();
  }
  if (act === "nfokind") {
    S.nfoKind = id === "fut" ? "fut" : "opt";
    applyNfoProduct();
    S.declared = false;
    resetLive();
    persist();
    paint();
  }
  if (act === "ticketprev") cycleTicket(-1);
  if (act === "ticketnext") cycleTicket(1);
  if (act === "flowprev") cycleFlow(-1);
  if (act === "flownext") cycleFlow(1);
  if (act === "phase") {
    S.phase = id;
    if (id === "plan") S.edit = false;
    paint();
  }
  if (act === "fillbook") {
    S.fillBook = A().book;
    S.foreignFill = false;
    S.fill = S.hasStop ? "withStop" : "noStop";
    if (S.asset === "usdm" || S.asset === "coinm" || S.asset === "options") S.positionCount = 1;
    say("Fill joined " + joinKeyLabel(A().book, contractId()));
    paint();
  }
  if (act === "fillother") {
    S.fillBook = otherBookId();
    S.foreignFill = true;
    S.fill = "none";
    say("Fill on " + otherBookId() + " · no join");
    paint();
  }
  if (act === "fillclear") {
    S.fillBook = null;
    S.foreignFill = false;
    S.fill = "none";
    paint();
  }
  if (act === "closebook") {
    if (S.asset === "usdm" || S.asset === "coinm" || S.asset === "options") {
      if (S.positionCount > 0) {
        S.positionCount = 0;
        S.debriefArmed = true;
        S.phase = "post";
        say("positionbook 1→0 · debrief this book only");
      } else {
        say("Already flat · Cross/x/liq none");
      }
    } else {
      S.debriefArmed = true;
      S.phase = "post";
      say("Close this book · debrief armed");
    }
    paint();
  }
  if (act === "spotinv") {
    S.spotInventoryTick += 1;
    say(S.asset === "usdm" || S.asset === "coinm"
      ? "Spot inventory changed · this book’s debrief not armed"
      : "Spot inventory tick " + S.spotInventoryTick);
    paint();
  }
  if (act === "flatten") {
    S.flattenAttempt = true;
    say("Flatten refused · MutationForbidden · TRADE parked");
    paint();
  }
  if (act === "cancelintent") {
    S.declared = false;
    resetLive();
    S.hasStop = true;
    say("Cancelled LiveBook declaration · not flatten");
    paint();
  }
  if (act === "adh") {
    S.adherence[id] = S.adherence[id] === true ? null : true;
    paint();
  }
  if (act === "chartbook") {
    S.chartBook = id;
    paint();
  }
  if (act === "declarecta") { S.phase = "plan"; paint(); }
  if (act === "capturevoice") { S.captureOn = S.captureOn === "voice" ? null : "voice"; paint(); }
  if (act === "captureshot") { S.captureOn = "shot"; S.unposted = true; say("Screenshot on this Mac"); paint(); }
  if (act === "delchart") { S.unposted = false; paint(); }
  if (act === "kill") { S.killWarn = true; paint(); }
  if (act === "killno") { S.killWarn = false; paint(); }
  if (act === "killyes") { S.killWarn = false; say("Kill · TRADE parked · no POST"); paint(); }
  if (act === "momenta") { S.momentA = true; paint(); }
  if (act === "momentb") {
    const all = ["stop","size","invalidation","exit","impulsive"].every(k => S.adherence[k] === true);
    if (!S.momentA) { say("Finish Moment A first"); return; }
    if (!all) { say("Only honest yes advances"); return; }
    S.momentB = true; paint();
  }
  if (act === "cooling") { S.cooling = id === "1"; paint(); }
  if (act === "ordertype") { S.orderType = id; coerceTicket(); paint(); }
  if (act === "sizemode") { S.sizeMode = id; coerceTicket(); paint(); }
  if (act === "tif") { S.tif = id; persistTicket(); paint(); }
  if (act === "reduce") { S.reduceOnly = !S.reduceOnly; persistTicket(); paint(); }
  if (act === "postonly") { S.postOnly = !S.postOnly; persistTicket(); paint(); }
  if (act === "role") { S.role = id; S.declared = false; resetLive(); paint(); }
  if (act === "togglestop") { S.hasStop = !S.hasStop; S.declared = false; paint(); }
  if (act === "fill") {
    S.fill = id;
    if (id === "noStop") S.hasStop = false;
    if (id === "withStop") S.hasStop = true;
    if (id === "none") S.hasStop = true;
    paint();
  }
  if (act === "setup") { S.setup = id; paint(); }
  if (act === "protect") { S.protectSL = !S.protectSL; paint(); }
  if (act === "sym") { bindSym(id); paint(); }
  if (act === "depth") { S.entry = +id; say("Limit " + id + " · not placed"); paint(); }
  if (act === "side") { S.side = id; paint(); }
  if (act === "calm") { S.calm = +id; paint(); }
  if (act === "conf") { S.conf = +id; paint(); }
  if (act === "right") { S.right = id; bindSym(contractId()); paint(); }
  if (act === "horizon") {
    S.horizon = id;
    S.days = id === "today" ? 1 : id === "expiry" ? S.dte : 3;
    paint();
  }
  if (act === "addleg") {
    const fut = isNfo() && S.nfoKind === "fut";
    const ok = fut ? (+S.qty > 0 && S.und) : (+S.qty > 0 && S.und && S.strike);
    if (ok) {
      S.legs.push({ kind: fut ? "fut" : "opt", und: S.und, expiry: S.expiry, strike: S.strike, right: S.right, side: S.side.toUpperCase(), qty: +S.qty });
      paint();
    } else say(fut ? "Need underlying and lots" : (isNfo() ? "Need underlying, strike, lots" : "Need underlying, strike, contracts"));
  }
  if (act === "rmleg") { S.legs.splice(+id, 1); paint(); }
  if (act === "declare") {
    const h = planReady();
    if (h) { say(h); return; }
    if (S.declared) { say("clientToken held · no second send"); return; }
    S.declared = true;
    S.phase = "live";
    say("Declared · LiveBook intent · no POST");
    paint();
  }
  if (act === "undeclare") {
    S.declared = false;
    resetLive();
    S.hasStop = true;
    say("Back to plan");
    paint();
  }
  if (act === "addtile") addTile(id);
  if (act === "rmtile") { e.preventDefault(); removeTile(id); }
  if (act === "dock") setDock(id);
  if (act === "save") { persist(); say("Saved " + board().name); }
  if (act === "saveas") {
    S.naming = true;
    document.getElementById("namebox").classList.add("on");
    const inp = document.getElementById("namein");
    inp.value = "";
    inp.focus();
  }
  if (act === "saveas-ok") saveAs(document.getElementById("namein").value);
  if (act === "saveas-cancel") {
    S.naming = false;
    document.getElementById("namebox").classList.remove("on");
  }
  if (act === "reset") resetBoard();
  if (act === "delete") deleteBoard();
});
document.addEventListener("input", (e) => {
  const act = e.target.getAttribute("data-act");
  if (!act) return;
  if (act === "und") S.und = e.target.value.toUpperCase();
  if (act === "symbol") S.symbol = e.target.value.toUpperCase();
  if (act === "expiry") S.expiry = e.target.value;
  if (act === "strike") S.strike = e.target.value;
  if (act === "qty") {
    const n = parseFloat(e.target.value);
    S.qtyOverride = Number.isFinite(n) ? n : null;
    S.qty = S.qtyOverride;
    persistTicket();
  }
  if (act === "quoteqty") {
    const n = parseFloat(e.target.value);
    S.quoteQty = Number.isFinite(n) ? n : null;
    persistTicket();
  }
  if (act === "trigger") { S.triggerPrice = e.target.value; persistTicket(); }
  if (act === "maxLoss") S.maxLoss = e.target.value;
  if (act === "inv") S.inv = e.target.value;
  if (act === "notea") S.noteA = e.target.value;
  if (act === "notec") S.noteC = e.target.value;
  if (act === "entry") { S.entry = parseFloat(e.target.value) || S.entry; drawSession(); }
  if (act === "sl") {
    const n = parseFloat(e.target.value);
    if (Number.isFinite(n) && n > 0) { S.sl = n; S.hasStop = true; }
    else { S.hasStop = false; }
    S.declared = false;
    drawSession();
  }
  if (act === "tp") { S.tp = parseFloat(e.target.value) || S.tp; drawSession(); }
  dump();
});
document.addEventListener("change", (e) => {
  const act = e.target.getAttribute("data-act");
  if (act === "qty" || act === "sl") paint();
});
document.addEventListener("pointerdown", (e) => { const el = e.target.closest(".press"); if (el) el.classList.add("is-down"); }, true);
document.addEventListener("pointerup", () => document.querySelectorAll(".press.is-down").forEach(el => el.classList.remove("is-down")));
document.addEventListener("pointermove", (e) => {
  if (S.tileDrag) {
    const cell = cellAt(e.clientX, e.clientY);
    const t = board().tiles.find(x => x.kind === S.tileDrag.kind);
    if (!cell || !t) return;
    const nx = Math.max(0, Math.min(COLS - t.w, cell.x));
    const ny = Math.max(0, cell.y);
    const ok = canPlace(board().tiles, nx, ny, t.w, t.h, t.kind);
    S.dropBad = !ok;
        t.x = nx; t.y = ny;
    const el = document.querySelector(`.tile[data-kind="${t.kind}"]`);
    if (el) {
      el.style.setProperty("--x", nx + 1);
      el.style.setProperty("--y", ny + 1);
      el.classList.toggle("bad", !ok);
      el.classList.toggle("ghost", ok);
    }
    const mosaic = document.getElementById("mosaic");
    if (mosaic) mosaic.style.setProperty("--rows", String(Math.max(5, ny + t.h, rowCount(board().tiles))));
  }
  if (S.tileResize) {
    const mosaic = document.getElementById("mosaic");
    if (!mosaic) return;
    const r = mosaic.getBoundingClientRect();
    const tiles = board().tiles;
    const rows = rowCount(tiles);
    const gap = 8;
    const colW = (r.width - gap * (COLS - 1)) / COLS;
    const rowH = (r.height - gap * (rows - 1)) / rows;
    const t = tiles.find(x => x.kind === S.tileResize.kind);
    if (!t) return;
    const dw = Math.round((e.clientX - S.tileResize.px) / (colW + gap));
    const dh = Math.round((e.clientY - S.tileResize.py) / (rowH + gap));
    const nw = Math.max(1, Math.min(MAX_W, S.tileResize.ow + dw));
    const nh = Math.max(1, Math.min(MAX_H, S.tileResize.oh + dh));
    const clampedW = Math.min(nw, COLS - t.x);
    const ok = canPlace(tiles, t.x, t.y, clampedW, nh, t.kind);
    if (ok) { t.w = clampedW; t.h = nh; }
    S.dropBad = !ok;
    const el = document.querySelector(`.tile[data-kind="${t.kind}"]`);
    if (el) {
      el.style.setProperty("--w", t.w);
      el.style.setProperty("--h", t.h);
      el.classList.toggle("bad", !ok);
    }
  }
});
document.addEventListener("pointerup", () => {
  if (S.tileDrag) {
    const t = board().tiles.find(x => x.kind === S.tileDrag.kind);
    if (t && !canPlace(board().tiles.filter(x => x.kind !== t.kind), t.x, t.y, t.w, t.h)) {
      t.x = S.tileDrag.ox; t.y = S.tileDrag.oy;
      say("That cell is occupied");
    }
    S.tileDrag = null; S.dropBad = false;
    commitGeometry();
  }
  if (S.tileResize) {
    S.tileResize = null; S.dropBad = false;
    commitGeometry();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
    if (e.key === "Enter" && S.naming) saveAs(document.getElementById("namein").value);
    return;
  }
  if (e.key === "ArrowLeft") {
    if (e.shiftKey) {
      if (S.phase === "plan") cycleTicket(-1);
      else cycleFlow(-1);
      return;
    }
    cycle(-1);
  }
  if (e.key === "ArrowRight") {
    if (e.shiftKey) {
      if (S.phase === "plan") cycleTicket(1);
      else cycleFlow(1);
      return;
    }
    cycle(1);
  }
  if (e.key === "[") {
    if (S.phase === "plan") cycleTicket(-1);
    else cycleFlow(-1);
  }
  if (e.key === "]") {
    if (S.phase === "plan") cycleTicket(1);
    else cycleFlow(1);
  }
  if (e.key === "e" || e.key === "E") setEdit(!S.edit);
});
window.addEventListener("resize", () => { drawSession(); drawDeclaredPaths(); });

(function boot() {
  const params = new URLSearchParams(location.search);
  const loaded = loadStore();
  S.store = loaded.store;
  const rawAsset = params.get("asset") === "nfo" ? "options" : params.get("asset");
  const asset = ASSETS[rawAsset] ? rawAsset : (ASSETS[loaded.store.asset] && loaded.store.asset !== "nfo" ? loaded.store.asset : "options");
  applyQuote(asset);
  adoptAssetSlice(asset);
  const wantDesk = params.get("desk") || loaded.store.optionsDesk;
  const wantKind = params.get("kind") || loaded.store.nfoKind;
  if (asset === "options" && (params.get("asset") === "nfo" || wantDesk === "nfo")) {
    S.nfoKind = wantKind === "fut" ? "fut" : "opt";
    applyNfoProduct();
  }
  const want = params.get("board") || S.boardId;
  if (want && S.boards[want]) S.boardId = want;
  else if (want && !S.boards[want]) say("Unknown board · cockpit");
  if (loaded.corrupt) say("Board store reset · cockpit");
  S.edit = params.get("edit") === "1";
  const wantTicket = String(params.get("ticket") || "").toUpperCase();
  if (TICKET_IDS.includes(wantTicket)) S.ticket = wantTicket;
  const wantFlow = String(params.get("flow") || "").toUpperCase();
  if (FLOW_IDS.includes(wantFlow)) S.flow = wantFlow;
  const wantPhase = String(params.get("phase") || "").toLowerCase();
  if (wantPhase === "live") {
    S.phase = "live";
  } else if (wantPhase === "post") {
    S.declared = true;
    S.phase = "post";
  } else if (wantPhase === "plan") {
    S.phase = "plan";
  }
  persist();
  paint();
})();
window.S = S;
window.paint = paint;
window.engine = engine;
</script>
</body>
