# Publish updater/appcast.xml to Vercel production after commits on main.
name: Deploy Sparkle feed (Vercel)

on:
  workflow_dispatch:

concurrency:
  group: deploy-updater-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Require Vercel secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "Missing VERCEL_TOKEN secret."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID secret."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID secret."; exit 1; }

      - name: Deploy to production (isolated tree)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp updater/appcast.xml updater/vercel.json updater/.vercelignore "$TMP/"
          mkdir -p "$TMP/.vercel"
          printf '%s\n' "{\"projectId\":\"${VERCEL_PROJECT_ID}\",\"orgId\":\"${VERCEL_ORG_ID}\",\"projectName\":\"updater\"}" \
            > "$TMP/.vercel/project.json"
          cd "$TMP"
          npx --yes vercel@59.23.2 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify custom domain feed
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSI --max-time 30 https://updates.tradeautopsy.in/appcast.xml | head -5
