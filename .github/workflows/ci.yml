name: CI

# Automatic CI disabled (macOS minutes are 10×). Run manually before releases.
on:
  workflow_dispatch:

# One macOS job (macOS minutes cost 10× Linux on GitHub). Previously six parallel macOS jobs.
jobs:
  macos-ci:
    name: macOS build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}

      - name: Rust agent — build and test
        working-directory: agent
        env:
          RUSTFLAGS: "-D unused"
          TRADEAUTOPSY_HOSTS_FILE: /tmp/test-hosts
        run: |
          cargo build --lib
          cargo test --all-features

      - name: Notch — build and test
        working-directory: notch
        run: |
          swift build
          swift test

      - name: Station — SwiftPM build and test
        run: |
          swift build --package-path station/
          swift test --package-path station/

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: station
        run: xcodegen generate

      - name: Build Station.app
        working-directory: station
        run: |
          xcodebuild \
            -project "TradeAutopsy Station.xcodeproj" \
            -scheme "TradeAutopsy Station" \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate .app
        id: locate
        run: |
          APP=$(find station/build -name "TradeAutopsy Station.app" -type d | head -1)
          test -n "$APP"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Zip .app and pack DMG
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          cd "$(dirname "$APP")"
          zip -r TradeAutopsyStation.zip "TradeAutopsy Station.app"
          chmod +x scripts/pack-station-dmg.sh
          ./scripts/pack-station-dmg.sh --from-app "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeAutopsy-Station-app
          path: |
            station/build/**/TradeAutopsyStation.zip
            dist/TradeAutopsy-Station-*.dmg
          retention-days: 7
