name: CI

# PR + main gate. Cheap Linux leg covers the UBI wasm adapters; the agent lib
# suite is macOS-only today (keyring apple-native, notify macos_kqueue are
# unconditional deps) so it stays on macos-15 — Lib tests only, no integration
# binaries, no xcodebuild. See docs/ci.md.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**.md'
      - 'updater/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**.md'
      - 'updater/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubi-wasm:
    name: UBI adapters (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-ubi-wasm-${{ hashFiles('agent/Cargo.lock') }}

      - name: Build every UBI adapter component
        working-directory: agent
        run: |
          set -euo pipefail
          for manifest in ubi-*-adapter/Cargo.toml; do
            echo "=== $manifest"
            cargo build --release --locked --target wasm32-wasip2 \
              --manifest-path "$manifest"
          done

  agent:
    name: Rust agent — lib tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}

      - name: cargo test --lib
        working-directory: agent
        env:
          # No -D warnings: the crate has ~97 pre-existing dead-code warnings;
          # fail the gate on test failures, not legacy lint debt.
          TRADEAUTOPSY_HOSTS_FILE: /tmp/test-hosts
        run: |
          cargo build --lib
          cargo test --lib
