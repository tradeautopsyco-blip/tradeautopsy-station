name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-tests:
    name: Rust agent tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
      - name: Compile agent lib unused-clean
        working-directory: agent
        run: cargo build --lib
        env:
          RUSTFLAGS: "-D unused"
          TRADEAUTOPSY_HOSTS_FILE: /tmp/test-hosts
      - name: Run agent tests
        working-directory: agent
        run: cargo test --all-features
        env:
          TRADEAUTOPSY_HOSTS_FILE: /tmp/test-hosts

  notch-build:
    name: Swift Notch build check
    runs-on: macos-15 # Swift 6.0 toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Build Notch (SwiftPM)
        working-directory: notch
        run: |
          swift build 2>&1 || echo "No Package.swift yet — add SwiftPM manifest to notch/"

  notch-tests:
    name: Notch tests
    runs-on: macos-15 # Swift 6.0 toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Run Notch tests
        working-directory: notch
        run: swift test

  station-build:
    name: Station build
    runs-on: macos-15 # Swift 6.0 toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Build Station (SwiftPM)
        run: swift build --package-path station/

  station-tests:
    name: Station tests
    runs-on: macos-15 # Swift 6.0 toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Run Station tests
        run: swift test --package-path station/

  build-app:
    name: Build Station.app
    runs-on: macos-15 # macos-15 required for TradeAutopsy Station builds
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build agent binary
        working-directory: agent
        run: cargo build --release

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: station
        run: xcodegen generate

      - name: Build Station.app
        working-directory: station
        run: |
          xcodebuild \
            -project "TradeAutopsy Station.xcodeproj" \
            -scheme "TradeAutopsy Station" \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate .app
        id: locate
        run: |
          APP=$(find station/build -name "TradeAutopsy Station.app" -type d | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT

      - name: Zip .app for upload
        run: |
          cd "$(dirname "${{ steps.locate.outputs.app_path }}")"
          zip -r TradeAutopsyStation.zip "TradeAutopsy Station.app"
          echo "zip_path=$(pwd)/TradeAutopsyStation.zip" >> $GITHUB_ENV

      - name: Pack unsigned DMG
        run: |
          chmod +x scripts/pack-station-dmg.sh
          ./scripts/pack-station-dmg.sh --from-app "${{ steps.locate.outputs.app_path }}"
          echo "dmg_path=$(ls -1 dist/TradeAutopsy-Station-*.dmg | head -1)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeAutopsy-Station-app
          path: |
            ${{ env.zip_path }}
            ${{ env.dmg_path }}
          retention-days: 7
