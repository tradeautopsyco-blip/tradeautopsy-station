[package]
name = "ubi-okx-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "UBI Wasm component for okx_com spot fills (B6 okx_com, ADR 0016)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
