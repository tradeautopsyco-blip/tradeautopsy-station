[package]
name = "ubi-fixture-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase-1 UBI fixture Wasm component (COM + Kotak JSON → FillEvent)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc"] }
