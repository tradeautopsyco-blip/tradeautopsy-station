[workspace]
members = [
    ".",
    "ubi-binance-com-adapter",
    "ubi-fixture-adapter",
    "ubi-kotak-neo-adapter",
    "ubi-zerodha-kite-adapter",
    "ubi-upstox-adapter",
    "ubi-fyers-adapter",
]
resolver = "2"

[package]
name = "tradeautopsy-agent"
version = "0.1.0"
edition = "2021"
description = "Headless TradeAutopsy agent — localhost API (extracted daemon)"

[[bin]]
name = "tradeautopsy-agent"
path = "src/main.rs"

[[bin]]
name = "prototype-today-engine"
path = "src/bin/prototype_today_engine.rs"

[lib]
name = "tradeautopsy_agent"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
hmac = "0.12"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
chrono = { version = "0.4.44", features = ["clock", "std"] }
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "vtab", "csvtab"] }
keyring = { version = "3", features = ["apple-native"] }
csv = "1.3"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
wasmtime = { version = "36", features = ["component-model"] }
wasmtime-wasi = "36"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
serial_test = "3"
wiremock = "0.6"
