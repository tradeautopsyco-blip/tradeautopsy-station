[package]
name = "ubi-zerodha-kite-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "UBI Wasm component for zerodha_kite equities fills (B6 zerodha_kite, R5)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
